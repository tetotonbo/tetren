<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#111827;
  display:flex; justify-content:center; align-items:flex-start;
  min-height:100vh; padding:8px 0;
  font-family:'Arial',sans-serif; color:#eee;
  user-select:none;
}
#wrap { display:flex; gap:12px; align-items:flex-start; }
.side { display:flex; flex-direction:column; gap:12px; }
.panel {
  background:#1f2937; border:1px solid #374151;
  border-radius:6px; padding:8px;
}
.panel-label {
  font-size:10px; color:#9ca3af; letter-spacing:2px;
  text-transform:uppercase; margin-bottom:6px;
}
.garb-btn {
  display:block; width:100%; background:#7c3aed; color:#fff;
  border:none; padding:7px 0; font-size:12px; font-weight:bold;
  border-radius:6px; cursor:pointer; letter-spacing:0.5px;
  transition:background .15s;
}
/* モード枠の3ボタン（デカミノ/REN/DPCセット）は押しやすいよう背を高く・間隔広めに。
   高さは固定にして、和文/欧文でボタンの高さがずれないようにする */
.mode-buttons > * + * { margin-top:10px; }
.mode-buttons .toggle-btn,
.mode-buttons .garb-btn {
  height:44px; padding:0; white-space:nowrap;
  display:flex; align-items:center; justify-content:center;
}
.mode-buttons .toggle-btn { height:36px; }   /* デカミノ・RENはDPCセットより低めに */
.mode-buttons .btn-group .garb-btn:last-child { font-size:19px; }
/* DPCセットと「再」を地続きの1コントロールに見せる（再がDPCセットの機能だと分かるように） */
.btn-group { display:flex; border-radius:6px; overflow:hidden; }
.btn-group .garb-btn { border-radius:0; }
.btn-group .garb-btn + .garb-btn { border-left:1px solid #4b5563; }
.garb-btn:hover { background:#6d28d9; }
.garb-btn:active { background:#5b21b6; }
canvas { display:block; }
#boardCanvas { border:2px solid #374151; border-radius:2px; }
/* ===== ぷよテト2風テーマ ===== */
body.ppt2-theme #boardWrap {
  padding: 10px;
  border-radius: 12px;
  /* 原作の水色フレーム: 明るいシアン + 白のハーフトーンドット + 白縁 + 濃紺の外縁 */
  background:
    radial-gradient(circle, rgba(255,255,255,0.5) 1.2px, transparent 1.8px) 0 0/9px 9px,
    linear-gradient(155deg, #9fe2ff, #45b4f0 38%, #1e88d6 100%);
  border: 3px solid #fff;
  box-shadow: 0 0 0 2px #0d3c6b, 0 6px 18px rgba(0,0,0,0.5);
}
body.ppt2-theme #boardCanvas {
  display: block;
  border-radius: 3px;
  /* 青枠と盤面の間の黒い縁（原作の内枠） */
  border: 3px solid #05060c;
  box-shadow: 0 0 0 1px rgba(120,190,255,0.35);
}
/* HOLD/NEXT: 原作の「黒箱＋白枠＋白抜き太字ラベル」 */
body.ppt2-theme #holdPanel,
body.ppt2-theme #nextPanel {
  padding: 0;
  border: none;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}
body.ppt2-theme #holdPanel .panel-label,
body.ppt2-theme #nextPanel .panel-label {
  color: #fff;
  font-weight: 900;
  font-size: 16px;
  letter-spacing: 3px;
  text-align: center;
  text-transform: none;
  background: #000;
  border: 2.5px solid #fff;
  border-bottom: none;
  border-radius: 5px 5px 0 0;
  padding: 4px 0 2px;
  margin-bottom: 0;
  width: 100px;
  box-sizing: border-box;
}
body.ppt2-theme #holdCanvas,
body.ppt2-theme #nextCanvas {
  display: block;
  border-radius: 0;
}
.stat-row { display:flex; gap:0; text-align:center; }
.stat-col { flex:1; }
.stat-col + .stat-col { border-left:1px solid #374151; }
.stat-val { font-size:20px; font-weight:bold; color:#fff; }
.step-btn {
  background:#374151; color:#fff; border:none;
  width:26px; height:26px; border-radius:4px;
  font-size:16px; cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s;
}
.step-btn:hover { background:#4b5563; }
.toggle-btn {
  display:block; width:100%; border:none; padding:7px 0;
  font-size:13px; font-weight:bold; border-radius:6px;
  cursor:pointer; letter-spacing:0.5px; transition:background .15s;
  color:#fff;
}
.speed-row {
  display:flex; align-items:center; gap:6px; margin-top:6px;
}
.speed-val {
  flex:1; text-align:center; font-size:14px; color:#e2e8f0; line-height:1;
}
.speed-unit { font-size:10px; color:#6b7280; }
/* ===== 地形取り込みダイアログ ===== */
#importOverlay {
  display:none; position:fixed; inset:0; z-index:200;
  background:rgba(4,6,12,0.82); align-items:center; justify-content:center; padding:20px;
}
#importOverlay.open { display:flex; }
#importPanel {
  background:#161c27; border:1px solid #374151; border-radius:10px;
  width:min(880px, 96vw); max-height:92vh; overflow:auto; padding:16px 18px 18px;
  box-shadow:0 18px 50px rgba(0,0,0,0.6);
}
.imp-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.imp-title { font-size:15px; font-weight:bold; color:#e5e7eb; letter-spacing:1px; }
.imp-x {
  background:none; border:none; color:#9ca3af; font-size:22px; line-height:1;
  cursor:pointer; padding:0 4px;
}
.imp-x:hover { color:#fff; }
#impDrop {
  border:2px dashed #4b5563; border-radius:10px; padding:26px 18px;
  text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
  outline:none;
}
#impDrop:hover, #impDrop:focus { border-color:#6b7280; background:rgba(255,255,255,0.02); }
#impDrop.drag { border-color:#22d3ee; background:rgba(34,211,238,0.08); }
.imp-drop-main { font-size:14px; color:#e5e7eb; font-weight:bold; }
.imp-drop-sub  { font-size:11px; color:#9ca3af; margin-top:6px; }
.imp-btn {
  background:#374151; color:#fff; border:none; border-radius:6px;
  padding:8px 14px; font-size:12px; font-weight:bold; cursor:pointer;
  transition:background .15s;
}
.imp-btn:hover { background:#4b5563; }
.imp-primary { background:#4f46e5; }
.imp-primary:hover { background:#4338ca; }
.imp-cols { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
.imp-col { flex:1; min-width:260px; }
.imp-col-narrow { flex:0 0 auto; }
.imp-label { font-size:10px; color:#9ca3af; letter-spacing:1px; margin-bottom:6px; }
#impCanvasWrap { line-height:0; }
#impCanvas { max-width:100%; border-radius:6px; cursor:crosshair; touch-action:none; }
#impPreview { border:1px solid #374151; border-radius:6px; background:#0d1117; display:block; }
.imp-hint { font-size:10px; color:#9ca3af; margin-top:6px; line-height:1.6; }
.imp-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
.kc-open-btn {
  display:block; width:100%; border:none; padding:8px 0;
  font-size:13px; font-weight:bold; border-radius:6px;
  cursor:pointer; background:#4f46e5; color:#fff;
  letter-spacing:0.5px; transition:background .15s; margin-top:8px;
}
.kc-open-btn:hover { background:#4338ca; }
/* ===== DPCセットダイアログ ===== */
#dpcOverlay {
  display:none; position:fixed; inset:0; z-index:200;
  background:rgba(4,6,12,0.82); align-items:center; justify-content:center; padding:20px;
}
#dpcOverlay.open { display:flex; }
#dpcPanel {
  background:#161c27; border:1px solid #374151; border-radius:10px;
  width:min(460px, 94vw); padding:16px 18px 18px;
  box-shadow:0 18px 50px rgba(0,0,0,0.6);
}
#dpcGrid { display:flex; flex-direction:column; gap:8px; }
.dpc-row { display:flex; gap:8px; justify-content:center; }
.dpc-btn {
  width:100px; flex:0 0 auto;
  background:#0d1117; border:1px solid #374151; border-radius:8px;
  padding:8px 0 6px; cursor:pointer; line-height:0; text-align:center;
  transition:border-color .12s, background .12s;
}
.dpc-btn:hover { border-color:#9ca3af; background:#1b2230; }
.dpc-name {
  display:block; line-height:1; margin-top:6px;
  font-size:11px; font-weight:bold; color:#9ca3af; letter-spacing:1px;
}
/* ラベル＋トグルスイッチの1行（ONで有効／OFFで無効） */
.tgl-row {
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; cursor:pointer; font-size:12px; color:#d1d5db; user-select:none;
}
.tgl-row input { display:none; }
.tgl {
  flex:0 0 auto; width:34px; height:18px; border-radius:9px;
  background:#4b5563; position:relative; transition:background .15s;
}
.tgl::after {
  content:''; position:absolute; top:2px; left:2px;
  width:14px; height:14px; border-radius:50%; background:#fff;
  transition:transform .15s;
}
.tgl-row input:checked + .tgl { background:#16a34a; }
.tgl-row input:checked + .tgl::after { transform:translateX(16px); }
/* 操作ボタンの出し入れ（PCではキーボードで操作するので既定では隠す） */
.ctrl-toggle {
  width:100%; background:#1f2937; color:#9ca3af;
  border:1px solid #374151; border-radius:8px;
  padding:8px 0; font-size:13px; font-weight:bold;
  cursor:pointer; letter-spacing:1px; transition:background .15s, color .15s;
}
.ctrl-toggle:hover { background:#374151; color:#e5e7eb; }
#ctrlHidden { display:none; flex-direction:column; gap:6px; }
#ctrlHidden.open { display:flex; }
/* ===== 操作ボタンパッド ===== */
.ctrl-pad { width:300px; display:flex; flex-direction:column; gap:6px; }
.ctrl-row { display:grid; gap:6px; }
.ctrl-row.r2 { grid-template-columns:repeat(2,1fr); }
.ctrl-row.r3 { grid-template-columns:repeat(3,1fr); }
.ctrl-btn {
  height:64px; background:#1f2937; color:#e5e7eb;
  border:1px solid #374151; border-radius:10px;
  font-size:28px; cursor:pointer;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2px;
  user-select:none; -webkit-tap-highlight-color:transparent;
  transition:background .1s, transform .08s;
}
.ctrl-btn:active, .ctrl-btn.pressed {
  background:#374151; transform:scale(0.93);
}
.ctrl-lbl { font-size:10px; color:#6b7280; line-height:1; }
.ctrl-btn.ctrl-hard {
  background:#1e3a5f; border-color:#2563eb; color:#93c5fd;
}
.ctrl-btn.ctrl-hard:active { background:#1d4ed8; }
.ctrl-btn.ctrl-hold {
  background:#2d1b4e; border-color:#7c3aed; color:#c4b5fd;
}
.ctrl-btn.ctrl-hold:active { background:#5b21b6; }
#overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.75);
  display:flex; flex-direction:column;
  justify-content:center; align-items:center; z-index:10;
}
#overlay h1 { font-size:32px; margin-bottom:8px; }
#overlay .sub { color:#9ca3af; font-size:13px; margin-bottom:20px; text-align:center; line-height:1.8; }
#startBtn {
  background:#16a34a; color:#fff; border:none;
  padding:10px 36px; font-size:16px; border-radius:6px;
  cursor:pointer; transition:background .2s;
}
#startBtn:hover { background:#15803d; }
/* ===== ライン消去メッセージ ===== */
#clearMsg {
  width:116px; text-align:right;
  pointer-events:none;
  opacity:0; transition:opacity 1s;
  white-space:nowrap; margin-top:6px;
  line-height:1.3;
}
#keyconfigModal {
  position:fixed; inset:0; background:rgba(0,0,0,.8);
  display:none; justify-content:center; align-items:center; z-index:20;
}
#keyconfigBox {
  background:#1f2937; border:1px solid #4b5563; border-radius:12px;
  padding:24px 28px; width:480px; max-height:90vh; overflow-y:auto;
}
#keyconfigBox h2 { font-size:18px; margin-bottom:6px; color:#f9fafb; text-align:center; }
#kcHeader {
  display:flex; align-items:center; margin-bottom:10px;
  padding:0 4px 8px 4px; border-bottom:1px solid #374151;
}
#kcHeader .kc-label { font-size:11px; color:#6b7280; font-weight:bold; text-transform:uppercase; letter-spacing:.05em; }
#kcHeader .kc-slot-head {
  font-size:11px; color:#6b7280; font-weight:bold; text-transform:uppercase;
  letter-spacing:.05em; width:110px; text-align:center;
}
.kc-row {
  display:flex; align-items:center;
  padding:6px 4px; gap:10px; border-radius:6px;
}
.kc-row:nth-child(odd) { background:#111827; }
.kc-row:nth-child(even) { background:transparent; }
.kc-label { font-size:14px; color:#e5e7eb; flex:1; min-width:0; }
.kc-slot { display:flex; align-items:center; gap:4px; width:110px; }
.kc-key {
  background:#374151; color:#f9fafb; border:1px solid #6b7280;
  border-radius:5px; padding:5px 0; font-size:13px; width:82px;
  text-align:center; cursor:pointer; transition:background .15s;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.kc-key:hover { background:#4b5563; }
.kc-key.waiting { background:#1e40af; border-color:#60a5fa; color:#bfdbfe; animation:kc-blink .6s infinite; }
@keyframes kc-blink { 0%,100%{opacity:1} 50%{opacity:.5} }
.kc-del {
  background:none; border:1px solid #4b5563; color:#6b7280;
  font-size:14px; cursor:pointer; padding:2px 5px; border-radius:4px;
  line-height:1; transition:color .15s, border-color .15s;
}
.kc-del:hover { color:#ef4444; border-color:#ef4444; }
/* 設定モーダルのタブ */
.cfg-tabs { display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid #374151; }
.cfg-tab {
  background:none; border:none; border-bottom:2px solid transparent;
  color:#9ca3af; font-size:14px; font-weight:bold; cursor:pointer;
  padding:8px 14px; transition:color .15s, border-color .15s;
}
.cfg-tab:hover { color:#e5e7eb; }
.cfg-tab.active { color:#fff; border-bottom-color:#6366f1; }
.cfg-pane { display:none; }
.cfg-pane.active { display:block; }
/* スキン選択 */
#skinList { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.skin-card {
  background:#111827; border:2px solid #374151; border-radius:8px;
  padding:10px 8px 8px; cursor:pointer; text-align:center;
  transition:border-color .15s, background .15s;
}
.skin-card:hover { border-color:#6b7280; background:#161f2e; }
.skin-card.selected { border-color:#6366f1; background:#1e243a; }
.skin-card canvas { display:block; margin:0 auto 6px; }
.skin-name { font-size:13px; font-weight:bold; color:#e5e7eb; }
.skin-desc { font-size:10px; color:#9ca3af; margin-top:2px; }
.kc-btns { display:flex; gap:10px; margin-top:18px; }
.kc-btns button {
  flex:1; padding:9px 0; border:none; border-radius:7px;
  font-size:14px; font-weight:bold; cursor:pointer;
}
</style>
</head>
<body>
<div id="wrap">

  <!-- 左: HOLD / ゴースト・落下 / 地形操作 -->
  <div class="side" style="align-items:flex-end;">

    <!-- HOLD -->
    <div class="panel" id="holdPanel">
      <div class="panel-label">HOLD</div>
      <canvas id="holdCanvas" width="100" height="80"></canvas>
    </div>

    <!-- デザイン + 落下設定 -->
    <div class="panel" style="width:108px;">
      <div class="panel-label">デザイン</div>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;
                    font-size:12px;color:#d1d5db;margin-bottom:8px;">
        <input type="checkbox" id="ghostCheck" checked
          onchange="showGhost=this.checked;draw();"
          style="width:14px;height:14px;cursor:pointer;">
        ゴースト
      </label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;
                    font-size:12px;color:#d1d5db;margin-bottom:8px;">
        <input type="checkbox" id="axisCheck"
          onchange="showAxis=this.checked;draw();"
          style="width:14px;height:14px;cursor:pointer;">
        軸表示
      </label>
      <div class="panel-label" style="font-size:14px;letter-spacing:1px;">落下設定</div>
      <div class="speed-row">
        <button class="step-btn" onclick="changeGravSpeed(-1)">‹</button>
        <div class="speed-val">
          <span id="gravSpeedVal">0</span>
          <span class="speed-unit"> G</span>
        </div>
        <button class="step-btn" onclick="changeGravSpeed(+1)">›</button>
      </div>
    </div>

    <!-- 地形操作 -->
    <div class="panel" style="width:108px;">
      <div class="panel-label">地形操作</div>
      <label class="tgl-row" title="ONの間だけ、盤面のクリック/ドラッグでブロックを設置・消去できます">
        <span>地形編集</span>
        <input type="checkbox" id="terrainToggle" checked
          onchange="setTerrainMode(this.checked)">
        <span class="tgl"></span>
      </label>
      <div id="colorSection">
        <div class="panel-label" style="margin-top:8px;">カラー</div>
        <div id="colorPalette" style="display:grid;grid-template-columns:repeat(4,20px);gap:4px;"></div>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="garb-btn" style="flex:1;background:#374151;"
          onclick="if(!gameOver)addGarbage(true)"
          title="地形を一段せり上げる（直前と同じ穴）">↑</button>
        <button class="garb-btn" style="flex:1;background:#374151;"
          onclick="if(!gameOver)shiftTerrainDown()"
          title="地形を強制的に一段下にシフトする">↓</button>
      </div>
      <button class="garb-btn" style="background:#374151;margin-top:6px;"
        onclick="openImport()"
        title="ぷよテトのゲーム画面のスクショから地形を読み取ります">地形取り込み</button>
    </div>

    <!-- LINES -->
    <div class="panel" style="text-align:center;width:108px;">
      <div class="panel-label">LINES</div>
      <div class="stat-val" id="linesEl">0</div>
    </div>

    <!-- キーコンフィグ -->
    <div class="panel" style="width:108px;">
      <button class="kc-open-btn" onclick="openConfig()" style="margin-top:0;">⚙ 設定</button>
    </div>

    <!-- ライン消去メッセージ -->
    <div id="clearMsg"></div>

  </div>

  <!-- 中央: ボード + 操作パッド -->
  <div style="display:flex;flex-direction:column;gap:8px;">
    <div style="position:relative;display:inline-block;" id="boardWrap">
      <canvas id="boardCanvas" width="300" height="610"></canvas>
    </div>

    <!-- 操作ボタンパッド -->
    <div class="ctrl-pad">

// 16進カラーを白寄りに薄める（amt: 0=元の色, 1=白）
function lighten(hex, amt) {
  const n = hex.replace('#', '');
  const r = parseInt(n.substring(0,2), 16);
  const g = parseInt(n.substring(2,4), 16);
  const b = parseInt(n.substring(4,6), 16);
  const m = v => Math.round(v + (255 - v) * amt);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
// 16進カラーを黒寄りに沈める（amt: 0=元の色, 1=黒）
function darken(hex, amt) {
  const n = hex.replace('#', '');
  const m = i => Math.round(parseInt(n.substring(i, i+2), 16) * (1 - amt));
  return `rgb(${m(0)},${m(2)},${m(4)})`;
}
// ぷよテト風セルの配色（元のセル画像から採取した値）。
// 元画像は低解像度をアップスケールしたものでエッジがぼやけていたため、
// 同じ配色・構造をキャンバスで描き直している。これならどの倍率でもくっきり出る。
const PPT2_TONE = {
  I: { gap:'#1c4363', gloss:'#d3fcfd', top:'#4aa3f7', mid:'#4ca7f7', bot:'#55b9f9', dark:'#2b6299' },
  O: { gap:'#bd6d29', gloss:'#fef9aa', top:'#f7d648', mid:'#f4cc45', bot:'#fbea51', dark:'#8d5b25' },
  T: { gap:'#852a9c', gloss:'#f2c9f7', top:'#b248bb', mid:'#a339a8', bot:'#ba49bc', dark:'#5e2f75' },
  S: { gap:'#1d4328', gloss:'#cbf78b', top:'#65ac33', mid:'#75c13a', bot:'#8ed943', dark:'#5c9737' },
  Z: { gap:'#6d1f23', gloss:'#f1a877', top:'#d43120', mid:'#ea3f29', bot:'#ec6b52', dark:'#8c1e14' },
  J: { gap:'#112888', gloss:'#9cdafb', top:'#2150e5', mid:'#265bde', bot:'#408df6', dark:'#16267b' },
  L: { gap:'#955330', gloss:'#fbe6ac', top:'#ef8533', mid:'#eb8031', bot:'#f2a73c', dark:'#8e431a' },
};

// ぷよテト風の1マスを描く。描けたらtrue（呼び出し側は他スキンの描画にフォールバックする）
function drawPPT2Cell(ctx, x, y, w, h, color, alpha) {
  if (color === GARBAGE_COLOR) {
    const img = PPT2_GARBAGE_IMG;
    if (!img.complete || img.naturalWidth === 0) return false;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, x, y, w, h);
    ctx.restore();
    return true;
  }
  const type = COLOR_TO_TYPE[color];   // 他スキンで置いたブロックもぷよテト柄に読み替える
  const t = type && PPT2_TONE[type];
  if (!t) return false;
  const sz  = Math.min(w, h);
  const ins = sz * 0.013;              // 継ぎ目の太さ
  const rad = sz * 0.08;               // 角の丸み（原作は角がきつめ）
  ctx.save();
  ctx.globalAlpha = alpha;
  // 1) セル間の継ぎ目（原作の暗い縁）
  ctx.fillStyle = t.gap;
  ctx.fillRect(x, y, w, h);
  // 2) 本体: 上端の艶 → 中間色 → 下端の影
  roundRectPath(ctx, x+ins, y+ins, w-ins*2, h-ins*2, rad);
  const g = ctx.createLinearGradient(x, y+ins, x, y+h-ins);
  g.addColorStop(0.00, t.gloss);
  g.addColorStop(0.075, t.gloss);      // 上端の艶は細く、切れ際をはっきりさせる
  g.addColorStop(0.145, t.top);
  g.addColorStop(0.50, t.mid);
  g.addColorStop(0.82, t.bot);
  g.addColorStop(1.00, t.dark);
  ctx.fillStyle = g;
  ctx.fill();
  // 3) 左右のふちを暗くして丸みを出す（本体の形でクリップしてから重ねる）
  ctx.save();
  ctx.clip();
  const side = ctx.createLinearGradient(x, 0, x+w, 0);
  side.addColorStop(0.00, 'rgba(0,0,0,0.30)');
  side.addColorStop(0.12, 'rgba(0,0,0,0)');
  side.addColorStop(0.88, 'rgba(0,0,0,0)');
  side.addColorStop(1.00, 'rgba(0,0,0,0.22)');
  ctx.fillStyle = side;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
  ctx.restore();
  return true;
}

// スキンを適用する（盤面・パレット・背景をまとめて切り替える）
function applySkin(id) {
  if (!SKINS.some(x => x.id === id)) id = 'plain';
  skinId = id;
  ppt2Theme = (id === 'ppt2');
  document.body.classList.toggle('ppt2-theme', ppt2Theme);
  // 地形パレットの色・選択中の描画カラーもスキンに合わせて再計算する
  terrainColor = paletteColorFor(terrainType);
  if (document.getElementById('colorPalette')) initPalette();
  try { localStorage.setItem('tetren_skin', id); } catch(e) {}
  if (cur) draw();
}
function loadSkin() {
  let saved = null;
  try { saved = localStorage.getItem('tetren_skin'); } catch(e) {}
  applySkin(saved || 'plain');
}

// 角丸パス（ctx.roundRect が無い環境向けのフォールバック付き）
function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w/2, h/2));
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

// スキンに応じて1マス描く。x,y はセル左上、size は1辺の長さ。
function drawSkinCell(ctx, x, y, size, color, alpha=1) {
  // ぷよテト風は画像に枠もハイライトも含まれるのでセル全面に描く
  if (ppt2Theme && drawPPT2Cell(ctx, x, y, size, size, color, alpha)) return;
  const isGarbage = (color === GARBAGE_COLOR);
  const type = isGarbage ? null : COLOR_TO_TYPE[color];
  const col = type ? currentSkin().colors[type] : color;
  // おじゃまは見分けやすさ優先で、どのスキンでも同じ描き方にする
  const style = isGarbage ? 'bevel' : currentSkin().style;
  const k = size / BS;             // 30px基準の倍率（ミニ表示やデカミノでも崩れないように）
  const x1 = x + 1, y1 = y + 1, w = size - 2, h = size - 2;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (style === 'gloss') {
    const g = ctx.createLinearGradient(x1, y1, x1, y1 + h);
    g.addColorStop(0,    lighten(col, 0.55));
    g.addColorStop(0.45, col);
    g.addColorStop(0.5,  darken(col, 0.12));
    g.addColorStop(1,    darken(col, 0.38));
    roundRectPath(ctx, x1, y1, w, h, 5*k); ctx.fillStyle = g; ctx.fill();
    const gl = ctx.createLinearGradient(x1, y1, x1, y1 + h*0.5);
    gl.addColorStop(0, 'rgba(255,255,255,0.55)');
    gl.addColorStop(1, 'rgba(255,255,255,0)');
    roundRectPath(ctx, x1+2.5*k, y1+1.5*k, w-5*k, h*0.40, 4*k); ctx.fillStyle = gl; ctx.fill();
    roundRectPath(ctx, x1+0.5, y1+0.5, w-1, h-1, 5*k);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = Math.max(1, k); ctx.stroke();
  } else if (style === 'matte') {
    roundRectPath(ctx, x1, y1, w, h, 3*k); ctx.fillStyle = col; ctx.fill();
    roundRectPath(ctx, x1+1.5*k, y1+1.5*k, w-3*k, h-3*k, 2*k);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = Math.max(1, k); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.10)'; ctx.fillRect(x1, y1 + h - 3*k, w, 3*k);
  } else if (style === 'dot') {
    ctx.fillStyle = col; ctx.fillRect(x1, y1, w, h);
    ctx.fillStyle = darken(col, 0.22);
    const d = Math.max(2, Math.round(4*k));
    for (let yy = y1 + d; yy < y1 + h - d*0.5; yy += d*2)
      for (let xx = x1 + d; xx < x1 + w - d*0.5; xx += d*2)
        ctx.fillRect(xx, yy, d, d);
    ctx.fillStyle = 'rgba(255,255,255,0.32)'; ctx.fillRect(x1, y1, w, Math.max(1, 2*k));
    ctx.strokeStyle = darken(col, 0.55);
    ctx.lineWidth = Math.max(1, 2*k);
    ctx.strokeRect(x1 + ctx.lineWidth/2, y1 + ctx.lineWidth/2, w - ctx.lineWidth, h - ctx.lineWidth);
  } else if (style === 'flat') {
    ctx.fillStyle = col; ctx.fillRect(x1, y1, w, h);
    ctx.strokeStyle = darken(col, 0.38);
    ctx.lineWidth = Math.max(1, k);
    ctx.strokeRect(x1 + ctx.lineWidth/2, y1 + ctx.lineWidth/2, w - ctx.lineWidth, h - ctx.lineWidth);
  } else if (style === 'glass') {
    // ほぼ透明。中身はうっすら色が乗る程度で、枠でミノを見分ける
    ctx.globalAlpha = alpha * 0.13;
    ctx.fillStyle = col; ctx.fillRect(x1, y1, w, h);
    ctx.globalAlpha = alpha * 0.9;
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(1.5, 2*k);
    ctx.strokeRect(x1 + ctx.lineWidth/2, y1 + ctx.lineWidth/2, w - ctx.lineWidth, h - ctx.lineWidth);
    ctx.globalAlpha = alpha * 0.25;
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillRect(x1 + 3*k, y1 + 3*k, w - 6*k, Math.max(1, 2*k));
  } else {
    // bevel（クラシック）
    ctx.fillStyle = col; ctx.fillRect(x1, y1, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(x1, y1, w, 4*k); ctx.fillRect(x1, y1, 4*k, h);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(x1, y1 + h - 4*k, w, 4*k); ctx.fillRect(x1 + w - 4*k, y1, 4*k, h);
  }
  ctx.restore();
}

// Retina等の高DPI画面では、描画バッファをそのまま拡大表示されるとミノがぼやける。
// 表示サイズ(CSSピクセル)は変えずにバッファだけ実ピクセル数に合わせ、
// コンテキストを同じ倍率で拡大しておく。描画コードの座標はCSSピクセルのままでよい。
function setupHiDPICanvas(canvas, ctx) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width, h = canvas.height;   // 属性値 = 本来の表示サイズ
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingQuality = 'high';
}

let lastGarbageCol = null; // 直前のおじゃまの穴列
let downHeld = false;     // ↓キー押しっぱなし状態
let lastSoftDrop = 0;     // ソフトドロップ最終処理時刻
const SOFT_DROP_RATE = 50; // ソフトドロップ間隔(ms)
let digMode = false;       // 掘り練習モード（自動せりあがりON/OFF）
let digTriggerType = 'time'; // トリガー種別: 'mino'=ミノごと / 'time'=秒数
let digCount = 0;          // ミノごとモードでのピース設置数
let digInterval = 3;       // 何個ごとに競り上がるか（1〜20）
let timeDigInterval = 3;   // 何秒ごとに競り上がるか（0.5〜60、1秒以下は0.5刻み）
let timeDigLastTs = 0;     // 秒数モードで直近せりあがりを起こした時刻（ts基準・0=未初期化）
let ren = 0;              // RENコンボカウンター
let renMode = false;      // 中空けRENモード
let dekaMode = false;     // デカミノモード（4倍ミノ）
let lastWasRotation = false; // 最後の操作が回転だったか（Tスピン判定用）
let lastKickIndex = 0;       // 最後に使ったSRSキックのインデックス
let clearMsgTimer = null;    // メッセージ消去タイマー

// ===== 7種1巡バッグ =====
function newBag() {
  const a = ['I','O','T','S','Z','J','L'];
  for (let i=a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function fillQ() {
  while (nextQ.length < NEXT_SHOW+1) {
    const isNew = (bag.length === 0); // バッグ補充タイミング = 新しい巡の先頭
    if (isNew) bag = newBag();
    nextQ.push({ type: bag.shift(), newBag: isNew });
  }
}

// ===== ピース生成 =====
// デカミノモードでは論理座標でスポーン（5列 / バッファ2行）
function mkPiece(type) {
  const d = PIECE_DEF[type];
  if (dekaMode) {
    return { type, state:0,
      row: BUF/2 - 1,               // 論理スポーン行 = 1
      col: type === 'I' ? 0 : 1,    // I:0列(0-3), その他:1列(1-3)
    };
  }
  return { type, state:0, row:d.spawnRow, col:d.spawnCol };
}
function spawn() {
  fillQ();
  cur = mkPiece(nextQ.shift().type);
  canHold = true; // ピース交代のたびにホールド権を回復
  lastWasRotation = false; // 新ピース出現時にTスピンフラグリセット
  lastKickIndex = 0;
  if (!valid(cur, 0, 0, cur.state)) {
    gameOver = true;
    setTimeout(() => showOverlay('ゲームオーバー','もう一度'), 100);
  }
}

// ===== 衝突判定 =====
// デカミノモードでは cur.row/col は論理座標（5×10グリッド）
// 実際のボード座標 = 論理座標 × 2
const DEKA_LCOLS = 5;
const DEKA_LTROW = TROW / 2; // = 12 (バッファ2 + 可視10)

function valid(p, dr, dc, st) {
  const cells = PIECE_DEF[p.type].cells[st];
  if (dekaMode) {
    for (const [r,c] of cells) {
      const lr = p.row+r+dr, lc = p.col+c+dc;
      if (lc < 0 || lc >= DEKA_LCOLS || lr >= DEKA_LTROW) return false;
      if (lr < 0) continue;
      const ar = lr*2, ac = lc*2;
      if (board[ar][ac] || board[ar][ac+1] ||
          board[ar+1][ac] || board[ar+1][ac+1]) return false;
    }
    return true;
  }
  for (const [r,c] of cells) {
    const nr = p.row+r+dr, nc = p.col+c+dc;
    if (nc<0||nc>=COLS||nr>=TROW) return false;
    if (nr>=0 && board[nr][nc]) return false;
  }
  return true;
}

// ===== ゴーストピース =====
function ghostRow() {
  let g = cur.row;
  while (valid({...cur, row:g+1}, 0, 0, cur.state)) g++;
  return g;
}

// ===== 移動 =====
function moveH(dc) {
  // デカミノモードでも論理座標で動くので特別処理不要
  if (valid(cur, 0, dc, cur.state)) {
    cur.col += dc;
    lastWasRotation = false; // 左右移動したら回転フラグをリセット
    resetLock(); draw();
  }
}
function softDrop() {
  if (valid(cur, 1, 0, cur.state)) {
    cur.row++;
    score++;
    resetLock(); draw();
    return true;
  }
  return false;
}
function hardDrop() {
  let d=0;
  while (valid(cur,1,0,cur.state)) { cur.row++; d++; }
  score += d*2;
  lock();
}

// ===== 回転 (SRS) =====
// デカミノモードでも論理座標なのでSRSキック通常通り使用
function rotate(dir) { // dir: 1=CW, -1=CCW
  const from = cur.state;
  const to   = (from + (dir===1?1:3)) % 4;
  const key  = STATE_NAMES[from] + STATE_NAMES[to];
  const kicks = KICKS[PIECE_DEF[cur.type].kickType][key] || [[0,0]];
  for (let ki = 0; ki < kicks.length; ki++) {
    const [dc, dr] = kicks[ki];
    if (valid(cur, dr, dc, to)) {
      cur.state = to;
      cur.row += dr;
      cur.col += dc;
      lastWasRotation = true;
      lastKickIndex = ki;
      resetLock(); draw(); return;
    }
  }
}

// ===== ホールド =====
function doHold() {
  if (holdType === null) {
    holdType = cur.type;
    spawn();
  } else {
    const t = holdType;
    holdType = cur.type;
    cur = mkPiece(t);
  }
  lastWasRotation = false;
  resetLock(); draw();
}

// ===== ロック =====
function resetLock() {
  if (lockTimer) { clearTimeout(lockTimer); lockTimer=null; }
  isLocking = false;
}
function startLock() {
  if (!isLocking) {
    isLocking = true;
    lockTimer = setTimeout(lock, 500);
  }
}
// ===== カラーパレット =====
// type: I/O/T/S/Z/J/L はミノ種別（pieceColor()でテーマに応じた色を都度取得する）。おじゃまはnull固定色。
const PALETTE_COLORS = [
  { label:'オート（なぞった形のミノ色になる）', type: 'AUTO' },
  { label:'おじゃま', type: null },
  { label:'I',        type: 'I' },
  { label:'O',        type: 'O' },
  { label:'T',        type: 'T' },
  { label:'S',        type: 'S' },
  { label:'Z',        type: 'Z' },
  { label:'J',        type: 'J' },
  { label:'L',        type: 'L' },
];

function paletteColorFor(type) {
  if (!type || type === 'AUTO') return GARBAGE_COLOR;   // オートはおじゃま色で置き始める
  return pieceColor(type);
}

function initPalette() {
  const container = document.getElementById('colorPalette');
  container.innerHTML = '';
  PALETTE_COLORS.forEach(({ label, type }) => {
    const color = paletteColorFor(type);
    const btn = document.createElement('button');
    btn.title = label;
    btn.dataset.type = type ?? '';
    btn.style.cssText = `
      width:20px; height:20px; border-radius:3px; border:2px solid transparent;
      background:${color}; cursor:pointer; padding:0; transition:border-color .1s;
    `;
    if (type === 'AUTO') {
      // 「オート」は正方形にAの1文字だけ載せる（「オート」だと枠に入らないため）
      btn.textContent = 'A';
      btn.style.color = '#e5e7eb';
      btn.style.font = 'bold 12px/1 Arial, sans-serif';
      btn.style.display = 'flex';
      btn.style.alignItems = 'center';
      btn.style.justifyContent = 'center';
    }
    if (type === terrainType) btn.style.borderColor = '#fff';
    btn.addEventListener('click', () => selectTerrainColor(type));
    container.appendChild(btn);
  });
}

function selectTerrainColor(type) {
  terrainType = type;
  terrainColor = paletteColorFor(type);
  autoGroup = [];   // 色を選び直したら、作りかけのミノは打ち切る
  document.querySelectorAll('#colorPalette button').forEach(btn => {
    btn.style.borderColor = (btn.dataset.type || null) === type ? '#fff' : 'transparent';
  });
}

// ===== 地形操作モード =====
// ON（既定）= 盤面をクリック/ドラッグして編集できる、OFF = 編集できない
function setTerrainMode(on) {
  terrainMode = !!on;
  const sw = document.getElementById('terrainToggle');
  if (sw) sw.checked = terrainMode;
  boardCanvas.style.cursor = terrainMode ? 'crosshair' : 'default';
  // 編集できないときは描画カラーの選択肢も隠す
  document.getElementById('colorSection').style.display = terrainMode ? '' : 'none';
  if (!terrainMode) terrainPainting = false;
}

function getTerrainCell(e) {
  const rect = boardCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top - PEEK; // 21段目を覗かせている分を差し引く
  const col = Math.floor(x / BS);
  const row = Math.floor(y / BS) + BUF; // 見えない上部分を加算
  if (col < 0 || col >= COLS || row < BUF || row >= TROW) return null;
  return { row, col };
}

// ===== オート（なぞった形のミノになる）=====
// 置きかけの4マス。1マス目は自由、2マス目以降は既に置いたマスの上下左右のみ。
// 4マス揃った時点で、その形に一致するミノの色へ塗り替えてリセットする。
let autoGroup = [];
// 形（正規化した4マスの並び）→ ミノ種別 の対応表
const AUTO_SHAPES = {};
(function buildAutoShapes() {
  const key = cells => {
    const mr = Math.min(...cells.map(c => c[0])), mc = Math.min(...cells.map(c => c[1]));
    return cells.map(([r,c]) => (r-mr) + ',' + (c-mc)).sort().join(' ');
  };
  for (const t in PIECE_DEF)
    for (const st of PIECE_DEF[t].cells) AUTO_SHAPES[key(st)] = t;
  AUTO_SHAPES._key = key;
})();

function autoIsAdjacent(row, col) {
  return autoGroup.some(([r,c]) => Math.abs(r-row) + Math.abs(c-col) === 1);
}

// オート時の1マス処理。描画が必要ならtrueを返す
function applyAutoAt(row, col) {
  if (board[row][col]) return false;   // 既にある場所は素通り（削除は消去モード側で行う）
  // 2マス目以降は、直前までに置いたマスと辺で接している場所だけ
  if (autoGroup.length > 0 && !autoIsAdjacent(row, col)) return false;
  board[row][col] = GARBAGE_COLOR;
  autoGroup.push([row, col]);
  if (autoGroup.length === 4) {
    const type = AUTO_SHAPES[AUTO_SHAPES._key(autoGroup)];
    if (type) {
      const color = pieceColor(type);
      for (const [r,c] of autoGroup) board[r][c] = color;
    }
    autoGroup = [];   // 次はまたどこからでも置ける
  }
  return true;
}

function applyTerrainAt(e) {
  const cell = getTerrainCell(e);
  if (!cell) return;
  const { row, col } = cell;
  if (terrainType === 'AUTO') {
    if (terrainPaintMode === 'erase') {
      if (!board[row][col]) return;
      board[row][col] = null;
      autoGroup = autoGroup.filter(([r,c]) => !(r === row && c === col));
    } else if (!applyAutoAt(row, col)) {
      return;   // 置けない場所だったので何もしない
    }
    draw();
    return;
  }
  if (terrainPaintMode === 'set') {
    board[row][col] = terrainColor;
  } else {
    board[row][col] = null;
  }
  draw();
}

boardCanvas.addEventListener('mousedown', e => {
  if (!terrainMode || gameOver) return;
  e.preventDefault();
  const cell = getTerrainCell(e);
  if (!cell) return;
  // 右クリック or 既にブロックがある場所は消去モード
  terrainPaintMode = (e.button === 2 || board[cell.row][cell.col]) ? 'erase' : 'set';
  terrainPainting = true;
  applyTerrainAt(e);
});

boardCanvas.addEventListener('mousemove', e => {
  if (!terrainMode || !terrainPainting || gameOver) return;
  e.preventDefault();
  applyTerrainAt(e);
});

boardCanvas.addEventListener('mouseup', e => {
  terrainPainting = false;
});

boardCanvas.addEventListener('mouseleave', e => {
  terrainPainting = false;
});

// 右クリックメニューを無効化（地形モード時のみ）
boardCanvas.addEventListener('contextmenu', e => {
  if (terrainMode) e.preventDefault();
});

// ===== 掘り練習モード（自動せりあがり：ミノごと／秒数）=====
function updateDigIntervalDisplay() {
  const isTime = digTriggerType === 'time';
  document.getElementById('digIntervalVal').textContent = isTime ? timeDigInterval : digInterval;
  document.getElementById('digIntervalUnit').textContent = isTime ? ' 秒ごと' : ' 個ごと';
}

function setDigTriggerType(type) {
  digTriggerType = type;
  digCount = 0;
  timeDigLastTs = 0;
  updateDigIntervalDisplay();
  updateDigCounter();
}

// ステッパーの長押し: 押し続けると連続で変化し、だんだん速くなる
let digRepeatTimer = null;
function startDigRepeat(delta) {
  stopDigRepeat();
  changeDigInterval(delta);          // まず1回（単押しはこれだけ）
  let interval = 130;                // 連射の初期間隔(ms)
  const tick = () => {
    changeDigInterval(delta);
    interval = Math.max(25, interval * 0.85);   // 押し続けるほど加速
    digRepeatTimer = setTimeout(tick, interval);
  };
  digRepeatTimer = setTimeout(tick, 400);       // 長押しと判定するまでの待ち
}
function stopDigRepeat() {
  if (digRepeatTimer) { clearTimeout(digRepeatTimer); digRepeatTimer = null; }
}
// ボタン外で指を離した場合やウィンドウを離れた場合にも確実に止める
window.addEventListener('mouseup', stopDigRepeat);
window.addEventListener('touchend', stopDigRepeat);
window.addEventListener('blur', stopDigRepeat);

function changeDigInterval(delta) {
  if (digTriggerType === 'time') {
    // 全域を0.1秒刻みで調整する（0.5〜60秒）。
    // 小数の誤差が溜まらないよう毎回1桁に丸める。
    const next = +(timeDigInterval + delta * 0.1).toFixed(1);
    timeDigInterval = Math.min(60, Math.max(0.5, next));
  } else {
    digInterval = Math.min(20, Math.max(1, digInterval + delta));
  }
  updateDigIntervalDisplay();
  updateDigCounter();
}

function toggleDigMode() {
  digMode = !digMode;
  digCount = 0;
  timeDigLastTs = 0;
  const btn = document.getElementById('digBtn');
  if (digMode) {
    btn.style.background = '#16a34a'; // 緑 = ON
    // RENモードを強制OFF
    if (renMode) {
      renMode = false;
      document.getElementById('renModeBtn').style.background = '#374151';
      for (let r = BUF; r < TROW; r++)
        for (let c = 0; c < COLS; c++) board[r][c] = null;
      ren = 0;
      draw();
    }
    // デカミノモードを強制OFF
    if (dekaMode) {
      dekaMode = false;
      document.getElementById('dekaModeBtn').style.background = '#374151';
      for (let r = BUF; r < TROW; r++)
        for (let c = 0; c < COLS; c++) board[r][c] = null;
      spawn(); draw();
    }
  } else {
    btn.style.background = '#374151'; // グレー = OFF
  }
  updateDigCounter();
}

// ===== 中空けRENモード =====
const REN_WALL_COLS = [0,1,2,7,8,9]; // 常に塞がっている列

function setupRenTerrain() {
  // 盤面リセット
  for (let r = 0; r < TROW; r++)
    for (let c = 0; c < COLS; c++) board[r][c] = null;
  // 左右3列をすべてグレーで埋める（可視行のみ）
  for (let r = BUF; r < TROW; r++)
    for (const c of REN_WALL_COLS) board[r][c] = GARBAGE_COLOR;
  // 最下行の中央4列：左から3つグレー（▪▪▪▫）
  board[TROW-1][3] = GARBAGE_COLOR;
  board[TROW-1][4] = GARBAGE_COLOR;
  board[TROW-1][5] = GARBAGE_COLOR;
  // board[TROW-1][6] は null のまま（穴）
}

function restoreRenWalls() {
  // ライン消去後も左右3列を維持
  for (let r = BUF; r < TROW; r++)
    for (const c of REN_WALL_COLS) board[r][c] = GARBAGE_COLOR;
}

// ===== デカミノモード =====
function toggleDekaMode() {
  dekaMode = !dekaMode;
  const btn = document.getElementById('dekaModeBtn');
  // 盤面リセット
  for (let r = BUF; r < TROW; r++)
    for (let c = 0; c < COLS; c++) board[r][c] = null;
  undoStack = [];
  if (dekaMode) {
    btn.style.background = '#b45309'; // オレンジ茶 = ON
    // RENモードを強制OFF
    if (renMode) {
      renMode = false;
      document.getElementById('renModeBtn').style.background = '#374151';
    }
    // せりあがり自動を強制OFF
    if (digMode) {
      digMode = false; digCount = 0; timeDigLastTs = 0;
      document.getElementById('digBtn').style.background = '#374151';
      updateDigCounter();
    }
  } else {
    btn.style.background = '#374151';
  }
  spawn(); draw();
}

function toggleRenMode() {
  renMode = !renMode;
  const btn = document.getElementById('renModeBtn');
  if (renMode) {
    btn.style.background = '#16a34a'; // 緑 = ON
    // 自動モードを強制OFF
    if (digMode) {
      digMode = false;
      digCount = 0; timeDigLastTs = 0;
      document.getElementById('digBtn').style.background = '#374151';
      updateDigCounter();
    }
    // デカミノモードを強制OFF
    if (dekaMode) {
      dekaMode = false;
      document.getElementById('dekaModeBtn').style.background = '#374151';
      spawn(); // 論理座標のピースを通常座標でリスポーン
    }
    setupRenTerrain();
  } else {
    btn.style.background = '#374151'; // グレー = OFF
    // 地形クリア（可視行のみ）
    for (let r = BUF; r < TROW; r++)
      for (let c = 0; c < COLS; c++) board[r][c] = null;
    // RENリセット
    ren = 0;
  }
  draw();
}

function updateDigCounter(remainSecOverride) {
  const el = document.getElementById('digCounter');
  if (!digMode) { el.innerHTML = ''; return; }
  const isTime = digTriggerType === 'time';
  const next = isTime
    ? (remainSecOverride !== undefined ? remainSecOverride : timeDigInterval)
    : digInterval - (digCount % digInterval);
  const unit = isTime ? '秒' : '個';
  el.innerHTML =
    `<span style="font-size:11px;">あと</span><br>` +
    `<span style="font-size:28px;font-weight:bold;color:#22d3ee;line-height:1.1;">${next}</span><br>` +
    `<span style="font-size:11px;">${unit}でせりあがり</span>`;
}

// ===== ミノを捨てる =====
function discardPiece() {
  resetLock();
  spawn(); // 現在のピースを破棄して次を出現させる
  draw();
}

// ===== DPCセット（選んだミノをHOLDした状態にしてミノ順をリセット） =====
const DPC_ROWS = [['I','T','O'], ['J','L','S','Z']];   // 選択画面の並び
let lastDpcType = null;   // 「再」ボタン用：直前にDPCセットで選んだミノ

function openDpc() {
  document.getElementById('dpcOverlay').classList.add('open');
  renderDpcGrid();
}
function closeDpc() {
  document.getElementById('dpcOverlay').classList.remove('open');
}
// ミノ選択ボタンを並べる（テーマ変更が反映されるよう開くたびに描き直す）
function renderDpcGrid() {
  const grid = document.getElementById('dpcGrid');
  grid.innerHTML = '';
  DPC_ROWS.forEach(types => {
   const row = document.createElement('div');
   row.className = 'dpc-row';
   types.forEach(type => {
    const btn = document.createElement('button');
    btn.className = 'dpc-btn';
    btn.title = type + 'ミノをHOLDにセットする';
    const cv = document.createElement('canvas');
    cv.width = 84; cv.height = 56;
    const cx = cv.getContext('2d');
    setupHiDPICanvas(cv, cx);
    drawMini(cx, type, 0, 84, 56, false, 14);
    const name = document.createElement('span');
    name.className = 'dpc-name';
    name.textContent = type;
    btn.appendChild(cv);
    btn.appendChild(name);
    btn.addEventListener('click', () => setDpcHold(type));
    row.appendChild(btn);
   });
   grid.appendChild(row);
  });
}
// 選んだミノをHOLDに入れ、地形を消してバッグを組み直し、現在のミノも出し直す
function setDpcHold(type) {
  lastDpcType = type;
  updateDpcAgainBtn();
  // 地形リセット（せりあがりの穴位置・Undo履歴・RENもここで初期化）
  board = Array.from({length:TROW}, ()=>new Array(COLS).fill(null));
  undoStack = []; lastGarbageCol = null; ren = 0;
  if (renMode) setupRenTerrain();   // RENモード中は開始時と同じ地形を敷き直す
  holdType = type;
  bag = []; nextQ = [];
  spawn();          // fillQ() で新しいバッグを引き直し、現在のミノを出し直す
  canHold = true;
  resetLock();
  closeDpc();
  updUI(); draw();
}
// 直前に選んだミノで、もう一度同じセットをやり直す
function repeatDpc() {
  if (!lastDpcType) { openDpc(); return; }   // まだ一度も選んでいなければ選択画面を出す
  setDpcHold(lastDpcType);
}
// 「再」ボタンの見た目（未選択のうちは押せなさそうに薄く出す）
function updateDpcAgainBtn() {
  const btn = document.getElementById('dpcAgainBtn');
  if (!btn) return;
  btn.style.opacity = lastDpcType ? '1' : '0.45';
  btn.title = lastDpcType
    ? `前回選んだ ${lastDpcType} ミノで、もう一度DPCセットします`
    : 'まだミノを選んでいません（押すと選択画面が開きます）';
}
updateDpcAgainBtn();

// ===== リセット（ゲーム開始時と同じ状態に戻す：盤面・ミノ順・B2B等すべて） =====
function resetTerrain() {
  resetGameState();
}

// ===== おじゃまブロック競り上がり =====
function addGarbage(sameHole) {
  // 穴の列を決定
  // おじゃまがない or ランダム指定 → ランダム、同じ穴指定かつ直前あり → 同じ列
  let holeCol;
  if (sameHole && lastGarbageCol !== null) {
    holeCol = lastGarbageCol;
  } else {
    // ランダム（直前と被っても可）
    holeCol = Math.floor(Math.random() * COLS);
  }
  lastGarbageCol = holeCol;

  // 盤面を1行上にシフト（row0 は消える）
  board.shift();
  // 一番下におじゃま行を追加
  const garbageRow = new Array(COLS).fill(GARBAGE_COLOR);
  garbageRow[holeCol] = null; // 穴
  board.push(garbageRow);

  // カレントピースが盤面と重なった場合は1行上へ押し上げ
  if (!valid(cur, 0, 0, cur.state)) {
    cur.row--;
    // それでも重なるなら強制押し上げ（スタック上端に接している場合）
    while (!valid(cur, 0, 0, cur.state) && cur.row > 0) cur.row--;
  }

  resetLock();
  draw();
}

// ===== 地形を強制的に一段下にシフト（addGarbageの逆方向） =====
function shiftTerrainDown() {
  board.pop(); // 最下段を削除
  board.unshift(new Array(COLS).fill(null)); // 最上段に空行を追加
  draw();
}

// ===== スナップショット保存 =====
function saveSnapshot() {
  undoStack.push({
    board:    board.map(row => [...row]),
    cur:      { ...cur },
    holdType, canHold,
    bag:      [...bag],
    nextQ:    [...nextQ],
    score, level, lines, b2b, ren, dropInterval,
    digCount,
  });
  if (undoStack.length > UNDO_MAX) undoStack.shift(); // 上限超えたら古いものを削除
}

// ===== Undo =====
function undo() {
  if (!undoStack.length) return;
  const s = undoStack.pop();
  resetLock();
  board        = s.board;
  cur          = mkPiece(s.cur.type); // スポーン位置から再出現
  holdType     = s.holdType;
  canHold      = s.canHold;
  bag          = s.bag;
  nextQ        = s.nextQ;
  score        = s.score;
  level        = s.level;
  lines        = s.lines;
  b2b          = s.b2b;
  ren          = s.ren;
  dropInterval = s.dropInterval;
  digCount     = s.digCount;
  lastDrop     = 0;
  timeDigLastTs = 0;
  updUI();
  updateDigCounter();
  draw();
}

// ===== Tスピン判定 =====
// デカミノモードでは cur.row/col が論理座標なので、コーナーオフセットは通常通り+2
// ただし isBlocked は論理座標→実ボード変換が必要
function detectTSpin() {
  if (cur.type !== 'T' || !lastWasRotation) return null;
  const r = cur.row, c = cur.col;
  function isBlocked(row, col) {
    if (dekaMode) {
      if (col < 0 || col >= DEKA_LCOLS || row >= DEKA_LTROW) return true;
      if (row < 0) return false;
      const ar = row*2, ac = col*2;
      return !!(board[ar][ac] || board[ar][ac+1] || board[ar+1][ac] || board[ar+1][ac+1]);
    }
    if (col < 0 || col >= COLS || row >= TROW) return true; // 壁・床
    if (row < 0) return false;
    return !!board[row][col];
  }
  const corners = [
    isBlocked(r,   c),    // 0: 左上
    isBlocked(r,   c+2),  // 1: 右上
    isBlocked(r+2, c),    // 2: 左下
    isBlocked(r+2, c+2),  // 3: 右下
  ];
  if (corners.filter(Boolean).length < 3) return null;
  // 各ステートのフロントコーナーインデックス
  const frontIdx = [[0,1],[1,3],[2,3],[0,2]][cur.state];
  const frontFilled = frontIdx.filter(i => corners[i]).length;
  // フロント2つ埋まり or キック5番目(index=4)使用 → フルTスピン
  if (frontFilled === 2 || lastKickIndex === 4) return 'full';
  return 'mini';
}

// ===== クリアメッセージ表示 =====
function showClearMessage(cleared, tSpin, isB2B, renCount, isPerfect) {
  if (!cleared && !tSpin && !isPerfect) return;
  const el = document.getElementById('clearMsg');
  let mainText = '', mainColor = '#fff';

  if (isPerfect) {
    mainText = 'PERFECT<br>CLEAR'; mainColor = '#fbbf24';
  } else if (tSpin) {
    const base = tSpin === 'mini' ? 'T-SPIN MINI' : 'T-SPIN';
    const cnt  = ['','SINGLE','DOUBLE','TRIPLE'][cleared] || '';
    mainText   = cnt ? `${base}<br>${cnt}` : base;
    mainColor  = tSpin === 'mini' ? '#c4b5fd' : '#a855f7';
  } else if (cleared === 4) {
    mainText = 'TETRIS'; mainColor = '#22d3ee';
  } else {
    mainText   = ['','1 LINE','2 LINE','3 LINE'][cleared] || `${cleared} LINE`;
    mainColor  = '#9ca3af';
  }

  let subs = '';
  if (isB2B) subs += `<div style="font-size:12px;color:#fbbf24;font-weight:bold;letter-spacing:1px;margin-top:2px;">BACK TO BACK</div>`;
  if (renCount >= 2) subs += `<div style="font-size:26px;color:#fb923c;font-weight:bold;margin-top:2px;text-shadow:0 2px 10px rgba(0,0,0,0.95);">REN ×${renCount - 1}</div>`;

  el.innerHTML =
    `<div style="font-size:${isPerfect?'17px':'22px'};font-weight:bold;color:${mainColor};` +
    `text-shadow:0 2px 10px rgba(0,0,0,0.95);line-height:1.2;">${mainText}</div>` + subs;
  el.style.opacity = '1';
  if (clearMsgTimer) clearTimeout(clearMsgTimer);
  clearMsgTimer = setTimeout(() => { el.style.opacity = '0'; }, 4000);
}

// ===== ゲームオーバー（ロックアウト）判定 =====
// 21段目以上 = 見えている20段より上（board の行インデックスが BUF 未満）
const MID_COL_L = Math.floor((COLS - 4) / 2);        // 真ん中4列の左端（10列なら3）
const MID_COL_R = MID_COL_L + 3;                     // 同 右端（10列なら6）
function isLockOut(placed) {
  const above = ([r]) => r < BUF;
  // 1) 真ん中4列で21段目以上に少しでも入ったら終了
  if (placed.some(([r,c]) => r < BUF && c >= MID_COL_L && c <= MID_COL_R)) return true;
  // 2) ミノ全体が21段目以上に収まってしまったら終了
  //    （20段目以下にブロックが1つでもあれば、こちらでは終了しない）
  return placed.every(above);
}

function lock() {
  if (lockTimer) { clearTimeout(lockTimer); lockTimer=null; }
  isLocking = false;
  saveSnapshot();

  // Tスピン判定（ピース設置前に行う）
  const tSpin = detectTSpin();
  lastWasRotation = false;

  const color = pieceColor(cur.type);
  const placed = [];   // 設置したブロックの実座標（ゲームオーバー判定に使う）
  if (dekaMode) {
    // デカミノモード: 論理セルを実際のボードに2×2で書き込む
    for (const [r,c] of PIECE_DEF[cur.type].cells[cur.state]) {
      const lr = cur.row+r, lc = cur.col+c;
      if (lr >= 0) {
        const ar = lr*2, ac = lc*2;
        board[ar][ac] = board[ar][ac+1] = color;
        board[ar+1][ac] = board[ar+1][ac+1] = color;
        placed.push([ar,ac],[ar,ac+1],[ar+1,ac],[ar+1,ac+1]);
      }
    }
  } else {
    for (const [r,c] of PIECE_DEF[cur.type].cells[cur.state]) {
      const nr=cur.row+r, nc=cur.col+c;
      if (nr>=0) { board[nr][nc] = color; placed.push([nr,nc]); }
    }
  }

  // ゲームオーバー判定（設置位置で決まる。ライン消去より前に見る）
  // 行インデックス r は下から数えた段数 L と r = TROW - L の関係。
  // 21段目以上（= 見えている20段より上）は r < BUF。
  if (placed.length && isLockOut(placed)) {
    gameOver = true;
    draw();
    setTimeout(() => showOverlay('ゲームオーバー','もう一度'), 100);
    return;
  }

  const cleared = clearLines();
  if (renMode) restoreRenWalls(); // RENモード：壁を常時維持

  // パーフェクトクリア判定
  const isPerfect = cleared > 0 && board.every(row => row.every(v => !v));

  // REN更新
  if (cleared > 0) { ren++; } else { ren = 0; }

  addScore(cleared, tSpin, isPerfect);

  // せりあがり自動モード（ミノごと）
  if (digMode && digTriggerType === 'mino') {
    digCount++;
    updateDigCounter();
    if (digCount % digInterval === 0) addGarbage(false);
  }

  spawn();
  draw();
}

// ===== ライン消去 =====
function clearLines() {
  if (dekaMode) {
    // デカミノモード: 論理行（実際の2行ペア）単位で消去
    let n = 0;
    for (let lr = DEKA_LTROW - 1; lr >= 0; lr--) {
      const ar = lr * 2;
      if (board[ar].every(v=>v) && board[ar+1].every(v=>v)) {
        board.splice(ar, 2);
        board.unshift(new Array(COLS).fill(null));
        board.unshift(new Array(COLS).fill(null));
        n++; lr++; // 同じ論理行を再チェック
      }
    }
    return n;
  }
  let n=0;
  for (let r=TROW-1; r>=0; r--) {
    if (board[r].every(v=>v)) {
      board.splice(r,1);
      board.unshift(new Array(COLS).fill(null));
      n++; r++;
    }
  }
  return n;
}

// ===== スコア計算 =====
const REN_TBL = [0,100,100,200,200,300,300,400,400,400,400,400];
const TSPIN_FULL = [400, 800, 1200, 1600];
const TSPIN_MINI = [100, 200, 400, 0];

function addScore(cleared, tSpin, isPerfect) {
  // ライン消去なし・Tスピンなし → スコア変動なし（b2bは維持）
  if (!cleared && !tSpin) { return; }

  const isHard = (cleared === 4) || (tSpin && cleared > 0);
  const isB2B  = isHard && b2b;

  // 基本スコア
  let base = 0;
  if      (tSpin === 'full') base = (TSPIN_FULL[cleared] ?? 0) * level;
  else if (tSpin === 'mini') base = (TSPIN_MINI[cleared] ?? 0) * level;
  else                       base = (SCORE_TABLE[cleared] ?? 0) * level;
  if (isB2B) base = Math.floor(base * 1.5);
  score += base;

  // RENボーナス
  if (cleared > 0 && ren >= 1)
    score += REN_TBL[Math.min(ren, 11)] * level;

  // パーフェクトクリアボーナス
  if (isPerfect) score += 3500 * level;

  // ライン数・レベル更新
  if (cleared > 0) {
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(50, 1000 - (level - 1) * 90);
    b2b = isHard;
  }

  updUI();
  showClearMessage(cleared, tSpin, isB2B, ren, isPerfect);
}
function updUI() {
  document.getElementById('linesEl').textContent = lines;
}

// ===== 描画 =====
function drawBlock(ctx, c, r, color, alpha=1) {
  drawSkinCell(ctx, c*BS, r*BS, BS, color, alpha);
}
// デカミノモード用: 論理セル1つを2BS×2BSの大きなブロックとして描画
function drawBigBlock(ctx, c, r, color, alpha=1) {
  drawSkinCell(ctx, c*BS, r*BS, BS*2, color, alpha);
}

// 回転軸のキャンバス座標を返す（カレントピースとゴーストで共用）
function pieceAxisPos(row, col, type) {
  if (dekaMode) {
    // 論理座標から実キャンバス座標に変換
    const vr2 = row*2 - BUF, vc2 = col*2;
    if (type === 'I') return [(vc2+4)*BS, (vr2+4)*BS];
    if (type === 'O') return [(vc2+2)*BS, (vr2+2)*BS];
    return [(vc2+2)*BS + BS, (vr2+2)*BS + BS];
  }
  const vr = row - BUF, vc = col;
  if (type === 'I') return [(vc+2)*BS, (vr+2)*BS];
  if (type === 'O') return [(vc+1)*BS, (vr+1)*BS];
  return [(vc+1)*BS + BS/2, (vr+1)*BS + BS/2];
}

function drawBoard() {
  // 21段目（バッファ最下行）を PEEK 分だけ覗かせるため、全体を下にずらして描く
  boardCtx.save();
  boardCtx.translate(0, PEEK);
  if (ppt2Theme && ppt2BgPatternBoard) {
    // 実際のぷよテト2フィールド画像をタイル状に敷き詰める（グリッド線も画像に含まれる）
    boardCtx.fillStyle = ppt2BgPatternBoard;
    boardCtx.fillRect(0,-PEEK,COLS*BS,ROWS*BS+PEEK);
    // 原作同様、盤面最上部に落ちる影（下に向かってフェードアウト）
    const shade = boardCtx.createLinearGradient(0, -PEEK, 0, BS*1.6);
    shade.addColorStop(0, 'rgba(0,0,10,0.55)');
    shade.addColorStop(1, 'rgba(0,0,10,0)');
    boardCtx.fillStyle = shade;
    boardCtx.fillRect(0,-PEEK,COLS*BS,BS*1.6+PEEK);
  } else if (ppt2Theme) {
    // 画像読み込み中の暫定フォールバック
    const g = boardCtx.createLinearGradient(0, 0, 0, ROWS*BS);
    g.addColorStop(0, '#241b3d');
    g.addColorStop(1, '#140f24');
    boardCtx.fillStyle = g;
    boardCtx.fillRect(0,-PEEK,COLS*BS,ROWS*BS+PEEK);
    boardCtx.strokeStyle = 'rgba(255,255,255,0.10)';
    boardCtx.lineWidth = 0.5;
    for (let r=-1;r<ROWS;r++) for (let c=0;c<COLS;c++)
      boardCtx.strokeRect(c*BS, r*BS, BS, BS);
  } else {
    boardCtx.fillStyle = '#0d1117';
    boardCtx.fillRect(0,-PEEK,COLS*BS,ROWS*BS+PEEK);
    boardCtx.strokeStyle = '#1f2937';
    boardCtx.lineWidth = 0.5;
    for (let r=-1;r<ROWS;r++) for (let c=0;c<COLS;c++)
      boardCtx.strokeRect(c*BS, r*BS, BS, BS);
  }
  // 固定ブロック（21段目 = r:BUF-1 も覗く分だけ描く）
  if (dekaMode) {
    // デカミノモード: 2×2単位で大きなブロックとして描画
    for (let r=BUF;r<TROW;r+=2) for (let c=0;c<COLS;c+=2)
      if (board[r][c]) drawBigBlock(boardCtx, c, r-BUF, board[r][c]);
  } else {
    for (let r=BUF-1;r<TROW;r++) for (let c=0;c<COLS;c++)
      if (board[r][c]) drawBlock(boardCtx, c, r-BUF, board[r][c]);
  }
  // ゴーストピース（showGhost時のみ）
  if (!gameOver && showGhost) {
    const gr = ghostRow();
    const cells = PIECE_DEF[cur.type].cells[cur.state];
    const color = pieceColor(cur.type);
    if (ppt2Theme) {
      // ぷよテト2風ゴースト（原作再現）:
      // ミノ色を白っぽく薄めた面 + 中央の暗い斑 + セルごとの白に近い破線枠
      const step = dekaMode ? 2 : 1;
      const sz = BS * step;
      // 隣接セルの共有辺が二重線にならないよう、辺は1本ずつしか引かない。
      // 上辺・左辺は常に引き、下辺・右辺は隣にセルが無いときだけ引く。
      const cellSet = new Set(cells.map(([r,c]) => r + ',' + c));
      boardCtx.save();
      boardCtx.lineJoin = 'miter';
      for (const [r,c] of cells) {
        const vr = dekaMode ? (gr+r)*2-BUF : gr+r-BUF;
        const vc = dekaMode ? (cur.col+c)*2 : cur.col+c;
        if (vr < -1) continue;
        const x = vc*BS, y = vr*BS;
        // 1) 中心ほど透明になるミノ面を作業キャンバスで作ってから盤面へ重ねる。
        //    中心はほぼ完全に透過し、外周へ向かうほどミノ色が残る。
        // 作業キャンバスも画面の実解像度で持つ（等倍で合成できるようにしてぼけを防ぐ）
        const gdpr = window.devicePixelRatio || 1;
        if (ppt2GhostCanvas.width !== Math.round(sz * gdpr)) {
          ppt2GhostCanvas.width  = Math.round(sz * gdpr);
          ppt2GhostCanvas.height = Math.round(sz * gdpr);
          ppt2GhostCtx.setTransform(gdpr, 0, 0, gdpr, 0, 0);
        }
        ppt2GhostCtx.clearRect(0, 0, sz, sz);
        if (!drawPPT2Cell(ppt2GhostCtx, 0, 0, sz, sz, color, 1)) {
          ppt2GhostCtx.fillStyle = color;
          ppt2GhostCtx.fillRect(0, 0, sz, sz);
        }
        // 中心を削り取る（destination-out は描いた分だけ不透明度を減らす）
        ppt2GhostCtx.globalCompositeOperation = 'destination-out';
        const mask = ppt2GhostCtx.createRadialGradient(
          sz/2, sz/2, 0, sz/2, sz/2, sz*0.70);
        mask.addColorStop(0,    'rgba(0,0,0,1)');    // 中心 = ほぼ完全透過
        mask.addColorStop(0.55, 'rgba(0,0,0,0.62)');
        mask.addColorStop(1,    'rgba(0,0,0,0)');    // 外周 = ミノ色を残す
        ppt2GhostCtx.fillStyle = mask;
        ppt2GhostCtx.fillRect(0, 0, sz, sz);
        ppt2GhostCtx.globalCompositeOperation = 'source-over';

        boardCtx.globalAlpha = 0.62;
        boardCtx.drawImage(ppt2GhostCanvas, x, y, sz, sz);
        boardCtx.globalAlpha = 1;
        // 4) 枠線: 白に近い実線で一周し、各辺の中央1/3だけ濃いミノ色で塗り替える。
        //    隣接セルの共有辺は片方だけが引くので二重線にならない。
        boardCtx.setLineDash([]);
        boardCtx.lineWidth = Math.max(1.5, sz*0.05);
        const p = 1.5, e = sz - 1.5;
        const edges = [
          [p,p, e,p],                                     // 上辺（常に）
          [p,e, p,p],                                     // 左辺（常に）
        ];
        if (!cellSet.has((r+1) + ',' + c)) edges.push([e,e, p,e]); // 下に隣が無ければ下辺
        if (!cellSet.has(r + ',' + (c+1))) edges.push([e,p, e,e]); // 右に隣が無ければ右辺
        const seg = (x0,y0,x1,y1) => {
          boardCtx.beginPath();
          boardCtx.moveTo(x+x0, y+y0);
          boardCtx.lineTo(x+x1, y+y1);
          boardCtx.stroke();
        };
        boardCtx.strokeStyle = lighten(color, 0.8);
        for (const [x0,y0,x1,y1] of edges) seg(x0,y0,x1,y1);
        boardCtx.strokeStyle = darken(color, 0.55);
        for (const [x0,y0,x1,y1] of edges) {
          const at = t => [x0+(x1-x0)*t, y0+(y1-y0)*t];
          seg(...at(1/3), ...at(2/3));
        }
      }
      boardCtx.restore();
    } else if (dekaMode) {
      for (const [r,c] of cells) {
        const vr0=(gr+r)*2-BUF, vc0=(cur.col+c)*2;
        if (vr0+1 >= 0) drawBigBlock(boardCtx, vc0, Math.max(vr0,0), color, 0.2);
        else if (vr0 >= -1) drawBigBlock(boardCtx, vc0, 0, color, 0.2);
      }
    } else {
      for (const [r,c] of cells) {
        const vr=gr+r-BUF, vc=cur.col+c;
        if(vr>=-1) drawBlock(boardCtx,vc,vr,color,0.2);
      }
    }
  }
  // カレントピース（常に表示）
  if (!gameOver) {
    const cells = PIECE_DEF[cur.type].cells[cur.state];
    const color = pieceColor(cur.type);
    if (dekaMode) {
      for (const [r,c] of cells) {
        const vr0=(cur.row+r)*2-BUF, vc0=(cur.col+c)*2;
        if (vr0 >= -1) drawBigBlock(boardCtx, vc0, Math.max(vr0,0), color);
      }
    } else {
      for (const [r,c] of cells) {
        const vr=cur.row+r-BUF, vc=cur.col+c;
        if(vr>=-1) drawBlock(boardCtx,vc,vr,color);
      }
    }
  }
  // 軸表示（カレントピースのみ）
  if (showAxis && !gameOver) {
    const [ax, ay] = pieceAxisPos(cur.row, cur.col, cur.type);
    if (ay >= 0) {
      boardCtx.save();
      boardCtx.fillStyle = 'rgba(0,0,0,0.85)';
      boardCtx.strokeStyle = 'rgba(255,255,255,0.9)';
      boardCtx.lineWidth = 1.5;
      boardCtx.beginPath();
      boardCtx.arc(ax, ay, 5, 0, Math.PI * 2);
      boardCtx.fill();
      boardCtx.stroke();
      boardCtx.restore();
    }
  }
  boardCtx.restore(); // translate(0, PEEK) を戻す
}

function drawMini(ctx, type, yOff, w, h, dim=false, bs=18) {
  if (!type) return;
  const cells = PIECE_DEF[type].cells[0];
  const color = pieceColor(type);
  const minC = Math.min(...cells.map(c=>c[1]));
  const maxC = Math.max(...cells.map(c=>c[1]));
  const minR = Math.min(...cells.map(c=>c[0]));
  const maxR = Math.max(...cells.map(c=>c[0]));
  const bw = maxC-minC+1, bh = maxR-minR+1;
  const sx = Math.floor((w-bw*bs)/2);
  const sy = yOff + Math.floor((h-bh*bs)/2);
  const alpha = dim ? 0.3 : 1;
  ctx.save();
  for (const [r,c] of cells) {
    const px = sx+(c-minC)*bs, py = sy+(r-minR)*bs;
    drawSkinCell(ctx, px, py, bs, color, alpha);
  }
  ctx.restore();
}

// ぷよテト風のHOLD/NEXT箱: 黒地 + 薄いドット模様 + 白枠（原作のパネル再現）
function drawPPT2PanelBox(ctx, x, y, w, h, withBorder=true) {
  ctx.save();
  ctx.fillStyle = '#000';
  ctx.fillRect(x, y, w, h);
  // ドット模様（原作の黒箱の質感）
  ctx.fillStyle = 'rgba(105,125,175,0.22)';
  for (let dy = y+4; dy < y+h-2; dy += 7)
    for (let dx = x+4; dx < x+w-2; dx += 7)
      ctx.fillRect(dx, dy, 1.5, 1.5);
  if (withBorder) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(x+1.25, y+1.25, w-2.5, h-2.5);
  }
  ctx.restore();
}

function drawHold() {
  if (ppt2Theme) {
    drawPPT2PanelBox(holdCtx, 0, 0, 100, 80);
  } else {
    holdCtx.fillStyle = '#0d1117';
    holdCtx.fillRect(0,0,100,80);
  }

}

function drawNext() {
  fillQ();
  if (ppt2Theme) {
    nextCtx.clearRect(0,0,100,420);
    // 先頭は大きめの箱、以降は少し内側に寄せた箱（原作のNEXT列の見た目）
    for (let i=0;i<NEXT_SHOW;i++) {
      const inset = i === 0 ? 0 : 5;
      drawPPT2PanelBox(nextCtx, inset, i*84 + (i===0?0:3), 100-inset*2, 84 - (i===0?3:6));

      nextCtx.beginPath();

      nextCtx.stroke();
      nextCtx.restore();
    }
    // ぷよテト風: 原作同様、2番目以降は少し小さく表示
    const miniBs = (ppt2Theme && i > 0) ? 15 : 18;
    drawMini(nextCtx, item.type, i*84, 100, 84, false, miniBs);
  }
}

// ===== 落下スピード =====
// 1段あたりの落下量（行/フレーム, 60fps想定）
//   1G  = 1行/秒（60フレームで1行）
//   20G = 盤面の高さぶん = 1フレームで最下段まで落ちる
//   間は等比（1段ごとに約1.47倍）でつないで、体感が滑らかに変化するようにする
const GRAV_MIN_ROWS = 1 / 60; // 1G（1行/秒 @60fps）
const GRAV_MAX_ROWS = TROW;   // 20G（24行 = 盤面全体）
function gravRowsPerFrame(g) {
  if (g <= 1)  return GRAV_MIN_ROWS;
  if (g >= 20) return GRAV_MAX_ROWS;
  return GRAV_MIN_ROWS * Math.pow(GRAV_MAX_ROWS / GRAV_MIN_ROWS, (g - 1) / 19);
}

function changeGravSpeed(delta) {
  gravSpeed = Math.min(20, Math.max(0, gravSpeed + delta));
  document.getElementById('gravSpeedVal').textContent = gravSpeed === 0 ? '0' : gravSpeed;
  lastDrop = 0;    // タイマーリセット
  gravAccum = 0;   // 端数もリセット（速度変更直後にいきなり1行落ちないように）
}

// ===== ゲームループ =====
let rafId;
function loop(ts) {
  if (gameOver) return;

  // ↓キー押しっぱなし：ブラウザのキーリピートに頼らずポーリング
  if (downHeld && ts - lastSoftDrop >= SOFT_DROP_RATE) {
    softDrop();
    lastSoftDrop = ts;
  }

  // 0G は自動で落とさない（ハードドロップするまでミノは止まったまま）
  // 1G〜20G: フレームベース（小数行/フレームを貯めて、たまった整数行ぶん落とす）
  if (gravSpeed > 0) {
    gravAccum += gravRowsPerFrame(gravSpeed);
    let steps = Math.floor(gravAccum);
    gravAccum -= steps;
    let dropped = 0;
    while (steps > 0 && valid(cur, 1, 0, cur.state)) {
      cur.row++;
      dropped++;
      steps--;
    }
    if (steps > 0) gravAccum = 0;   // 着地して落とし切れなかった端数は持ち越さない
    if (dropped > 0) { resetLock(); draw(); }
    if (!valid(cur, 1, 0, cur.state) && !isLocking) startLock();
  }

  // せりあがり自動モード（秒数）
  if (digMode && digTriggerType === 'time') {
    if (!timeDigLastTs) timeDigLastTs = ts;
    const remainMs = timeDigInterval * 1000 - (ts - timeDigLastTs);
    if (remainMs <= 0) {
      addGarbage(false);
      timeDigLastTs = ts;
      updateDigCounter(timeDigInterval);
    } else {
      updateDigCounter(Math.max(0.1, Math.ceil(remainMs / 100) / 10));
    }
  }

  rafId = requestAnimationFrame(loop);
}

// 実機スクショから採寸したミノの代表色。判定はこの色との距離で行う。

  I: [ 76,169,248], O: [248,215, 73], T: [176, 68,180], S: [116,193, 57],
  Z: [234, 64, 41], J: [ 40, 95,227], L: [239,136, 51],

let impGhost = null;                 // ゴーストの読み取り結果 [row][col] = 'I'|..|null
