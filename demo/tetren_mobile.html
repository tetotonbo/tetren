<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>テト練（スマホ版）| テトリス練習ツール</title>
<meta name="description" content="テト練はブラウザで動く無料のテトリス練習ツールです。地形を自由に編集して同じ場面を何度でも練習でき、せりあがり、1手戻す、落下速度0〜20G、RENモード、デカミノモード、ぷよテト風の見た目に対応。インストール不要でPC・スマホから使えます。">
<link rel="canonical" href="https://tetotonbo.github.io/tetren/tetren.html">
<link rel="icon" href="/tetren/favicon.png" type="image/png">
<meta name="theme-color" content="#111827">
<meta property="og:type" content="website">
<meta property="og:site_name" content="テト練">
<meta property="og:title" content="テト練（スマホ版）| テトリス練習ツール">
<meta property="og:description" content="テト練はブラウザで動く無料のテトリス練習ツールです。地形を自由に編集して同じ場面を何度でも練習でき、せりあがり、1手戻す、落下速度0〜20G、RENモード、デカミノモード、ぷよテト風の見た目に対応。インストール不要でPC・スマホから使えます。">
<meta property="og:url" content="https://tetotonbo.github.io/tetren/tetren.html">
<meta property="og:image" content="https://tetotonbo.github.io/tetren/favicon.png">
<meta name="twitter:card" content="summary">
<!-- アクセス解析（GoatCounter）: Cookieを使わず集計値のみ。入口ページには入れない
     （即リダイレクトするので二重カウントになるため） -->
<script data-goatcounter="https://tetren.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  background:#111827; height:100%;
  font-family:'Arial',sans-serif; color:#eee;
  user-select:none; -webkit-user-select:none;
  overflow:hidden; touch-action:manipulation;
}
#wrap {
  display:flex; flex-direction:row;
  align-items:flex-start; justify-content:center;
  gap:5px; padding:4px 4px 2px;
  height:100%; overflow:hidden;
  /* カンペ画像の最前面固定を外したとき、盤面の裏に回せるようにする */
  position:relative; z-index:2;
}
.side-col {
  display:flex; flex-direction:column;
  align-items:center; gap:5px; flex-shrink:0;
  /* 項目が増えて画面より長くなっても、全体を押し広げずカラム内でスクロールする */
  max-height:100%; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.side-col::-webkit-scrollbar { display:none; }
.m-lbl {
  font-size:9px; color:#6b7280; letter-spacing:1px;
  text-transform:uppercase; text-align:center; margin-bottom:2px;
}
canvas { display:block; }
#boardCanvas { border:2px solid #374151; border-radius:2px; }
#center-col {
  display:flex; flex-direction:column;
  align-items:center; gap:4px; flex-shrink:0;
}
#stats-bar {
  display:flex; text-align:center;
  background:#1f2937; border:1px solid #374151;
  border-radius:6px; overflow:hidden; flex-shrink:0;
}
.stat-col { flex:1; padding:3px 4px; }
.stat-col + .stat-col { border-left:1px solid #374151; }
.stat-lbl { font-size:8px; color:#9ca3af; letter-spacing:1px; text-transform:uppercase; }
.stat-val { font-size:15px; font-weight:bold; color:#fff; line-height:1.1; }
.ctrl-pad { display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
.ctrl-row { display:grid; gap:4px; }
.ctrl-row.r2 { grid-template-columns:repeat(2,1fr); }
.ctrl-row.r3 { grid-template-columns:repeat(3,1fr); }
.ctrl-btn {
  height:66px; background:#1f2937; color:#e5e7eb;
  border:1px solid #374151; border-radius:10px;
  font-size:30px; cursor:pointer;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1px;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  touch-action:none;
  transition:background .08s, transform .06s;
}
.ctrl-btn:active { background:#374151; transform:scale(0.94); }
.ctrl-lbl { font-size:9px; color:#6b7280; line-height:1; }
.ctrl-btn.ctrl-hold { background:#2d1b4e; border-color:#7c3aed; color:#c4b5fd; }
.ctrl-btn.ctrl-hold:active { background:#5b21b6; }
.ctrl-btn.ctrl-hard { background:#1e3a5f; border-color:#2563eb; color:#93c5fd; }
.ctrl-btn.ctrl-hard:active { background:#1d4ed8; }
#opts {
  display:grid; grid-template-columns:repeat(2,1fr);
  gap:4px; flex-shrink:0;
}
.opt-btn {
  padding:12px 4px; background:#1f2937; color:#d1d5db;
  border:1px solid #374151; border-radius:6px;
  font-size:13px; font-weight:bold; cursor:pointer;
  text-align:center; line-height:1.3;
  -webkit-tap-highlight-color:transparent;
  transition:background .1s;
}
.opt-btn:active { background:#374151; }
.side-btn {
  width:100%; padding:6px 2px;
  background:#1f2937; color:#d1d5db;
  border:1px solid #374151; border-radius:6px;
  font-size:9px; font-weight:bold; cursor:pointer;
  text-align:center; line-height:1.4;
  -webkit-tap-highlight-color:transparent;
  transition:background .1s;
}
.side-btn:active { background:#374151; }
#colorPaletteWrap {
  display:none; flex-wrap:wrap; gap:4px;
  justify-content:center; padding:5px;
  background:#1f2937; border:1px solid #374151; border-radius:6px;
  flex-shrink:0; box-sizing:border-box; max-width:100%;
}
.color-swatch {
  /* 大きさは initLayout() が盤面幅から決める（全部が1段に収まるサイズ） */
  width:var(--swatch,26px); height:var(--swatch,26px); border-radius:4px;
  border:2px solid transparent; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation; transition:border-color .1s;
}
.color-swatch.sel { border-color:#fff; }
.mini-panel {
  background:#1f2937; border:1px solid #374151;
  border-radius:6px; padding:5px; width:100%;
}
#dig-info {
  font-size:9px; color:#6b7280; text-align:center; line-height:1.5;
}
.di-row { display:flex; align-items:center; gap:2px; margin-top:3px; }
.di-btn {
  background:#374151; color:#fff; border:none;
  width:20px; height:20px; border-radius:3px;
  font-size:12px; cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.di-val { font-size:10px; color:#e2e8f0; flex:1; text-align:center; }
/* ===== トグルスイッチ（PC版と見た目を揃える） ===== */
/* 左カラムが狭いので、文字とスイッチを小さめにして1行に収める */
.tgl-row {
  display:flex; align-items:center; justify-content:space-between; gap:2px;
  width:100%; cursor:pointer; font-size:8px; color:#9ca3af;
  line-height:1.2; white-space:nowrap;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.tgl-row input { display:none; }
.tgl {
  flex:0 0 auto; width:22px; height:12px; border-radius:6px;
  background:#4b5563; position:relative; transition:background .15s;
}
.tgl::after {
  content:''; position:absolute; top:2px; left:2px;
  width:8px; height:8px; border-radius:50%; background:#fff;
  transition:transform .15s;
}
input:checked + .tgl { background:#16a34a; }
input:checked + .tgl::after { transform:translateX(10px); }

/* ===== バージョン表示 ===== */
#verLabel {
  margin-top:4px; text-align:center; font-size:8px;
  color:#4b5563; letter-spacing:0.5px;
}

/* ===== カンペ画像（画面に重ねて表示する参考画像） ===== */
#shotOverlay {
  display:none; position:fixed; inset:0; z-index:200;
  background:rgba(4,6,12,0.86); align-items:center; justify-content:center; padding:14px;
}
#shotOverlay.open { display:flex; }
#shotDialog {
  background:#161c27; border:1px solid #374151; border-radius:10px;
  width:min(360px, 94vw); padding:14px;
}
#shotDialog h2 { font-size:14px; color:#e5e7eb; text-align:center; margin-bottom:4px; }
#shotDialog .sub2 { font-size:10px; color:#9ca3af; text-align:center; margin-bottom:10px; line-height:1.6; }
#shotDrop {
  border:2px dashed #4b5563; border-radius:8px; padding:26px 10px;
  text-align:center; font-size:11px; color:#d1d5db; line-height:1.8;
}
#shotDrop.drag { border-color:#22d3ee; background:rgba(34,211,238,0.08); }
.shot-act { display:flex; gap:6px; margin-top:12px; }
.shot-act button {
  flex:1; padding:8px 0; border:none; border-radius:6px;
  font-size:11px; font-weight:bold; cursor:pointer;
  background:#374151; color:#d1d5db;
}
.shot-win {
  position:fixed; width:260px; height:200px;
  background:#0f131c; border:1px solid #374151; border-radius:8px;
  box-shadow:0 10px 30px rgba(0,0,0,0.55); overflow:hidden; z-index:300;
  display:flex; flex-direction:column;
}
.shot-win.unpinned { z-index:1; }
.shot-bar {
  display:flex; align-items:center; gap:4px; padding:4px 5px;
  background:#1f2735; touch-action:none; user-select:none; flex:0 0 auto;
  /* ウィンドウを小さくしてもボタンが切れないよう、狭いときは折り返す */
  flex-wrap:wrap;
}
.shot-bar .sw-title { font-size:9px; color:#9ca3af; margin-right:auto; }
.sw-btn {
  background:#374151; border:none; color:#d1d5db; font-size:9px;
  border-radius:4px; padding:3px 6px; white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.sw-btn.on { background:#4f46e5; color:#fff; }
.shot-body { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; background:#000; }
.shot-body img { width:100%; height:100%; object-fit:contain; display:block; -webkit-user-drag:none; }
.sw-rs { position:absolute; touch-action:none; }
.sw-rs-l  { left:0;  top:24px; bottom:0; width:10px; }
.sw-rs-r  { right:0; top:24px; bottom:0; width:10px; }
.sw-rs-b  { left:10px; right:10px; bottom:0; height:10px; }
.sw-rs-bl { left:0;  bottom:0; width:18px; height:18px; }
.sw-rs-br { right:0; bottom:0; width:20px; height:20px;
            background:linear-gradient(135deg, transparent 50%, #6b7280 50%); }

/* DPCセット（ミノを選んでHOLDに入れ、ツモを引き直す） */
#dpcOverlay {
  display:none; position:fixed; inset:0; z-index:30;
  background:rgba(4,6,12,0.88); align-items:center; justify-content:center; padding:14px;
}
#dpcOverlay.open { display:flex; }
#dpcPanel {
  background:#161c27; border:1px solid #374151; border-radius:10px;
  padding:12px; width:100%; max-width:340px;
}
#dpcPanel h2 { font-size:14px; color:#e5e7eb; text-align:center; margin-bottom:4px; }
#dpcPanel .sub2 { font-size:10px; color:#9ca3af; text-align:center; margin-bottom:10px; line-height:1.6; }
.dpc-row { display:flex; gap:6px; justify-content:center; margin-bottom:6px; }
.dpc-btn {
  width:72px; background:#0d1117; border:1px solid #374151; border-radius:8px;
  padding:6px 0 4px; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.dpc-btn:active { background:#1b2230; border-color:#9ca3af; }
.dpc-btn canvas { display:block; margin:0 auto; }
.dpc-name { display:block; font-size:10px; font-weight:bold; color:#9ca3af; margin-top:2px; text-align:center; }
.dpc-close {
  width:100%; margin-top:6px; padding:9px 0; border:none; border-radius:7px;
  background:#16a34a; color:#fff; font-size:13px; font-weight:bold; cursor:pointer;
}
/* サイドの DPC / ↻ を1行に並べる */
.dpc-side-row { display:flex; gap:3px; width:100%; margin-top:4px; }
.dpc-side-row .side-btn { margin-top:0; }
.dpc-side-row .side-btn.again { flex:0 0 26px; font-size:13px; padding:6px 0; }
#overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.85);
  display:none; flex-direction:column;
  justify-content:center; align-items:center; z-index:10; padding:20px;
}
#overlay h1 { font-size:22px; margin-bottom:6px; text-align:center; }
#overlay .sub { color:#9ca3af; font-size:12px; margin-bottom:20px; text-align:center; line-height:1.8; }
#startBtn {
  background:#16a34a; color:#fff; border:none;
  padding:12px 44px; font-size:16px; border-radius:8px;
  cursor:pointer; font-weight:bold;
}
#clearMsg {
  font-size:12px; text-align:center;
  pointer-events:none;
  opacity:0; transition:opacity 1s;
  line-height:1.3; width:100%;
  padding-top:4px;
}
</style>
</head>
<body>
<div id="wrap">

  <!-- 左: HOLD -->
  <div class="side-col" id="leftCol">
    <div class="mini-panel" style="padding:5px 3px;">
      <div class="m-lbl">HOLD</div>
      <canvas id="holdCanvas"></canvas>
      <label class="tgl-row" style="margin-top:4px;" title="OFFにするとミノを置くまで再ホールドできません">
        <span>連続</span>
        <input type="checkbox" id="optMultiHold" checked
          onchange="setOption('multiHold', this.checked)">
        <span class="tgl"></span>
      </label>
    </div>
    <label class="tgl-row">
      <span>ゴースト</span>
      <input type="checkbox" id="ghostCheck" checked
        onchange="showGhost=this.checked;draw();">
      <span class="tgl"></span>
    </label>
    <label class="tgl-row">
      <span>軸表示</span>
      <input type="checkbox" id="axisCheck"
        onchange="showAxis=this.checked;draw();">
      <span class="tgl"></span>
    </label>
    <div class="m-lbl" style="margin:4px 0 0;">落下設定</div>
    <div class="di-row" style="margin-top:0;">
      <button class="di-btn"
        onmousedown="startRepeat(()=>changeGravSpeed(-1))" onmouseup="stopRepeat()" onmouseleave="stopRepeat()"
        ontouchstart="event.preventDefault();startRepeat(()=>changeGravSpeed(-1))" ontouchend="stopRepeat()">‹</button>
      <div class="di-val"><span id="gravSpeedVal">0</span> G</div>
      <button class="di-btn"
        onmousedown="startRepeat(()=>changeGravSpeed(+1))" onmouseup="stopRepeat()" onmouseleave="stopRepeat()"
        ontouchstart="event.preventDefault();startRepeat(()=>changeGravSpeed(+1))" ontouchend="stopRepeat()">›</button>
    </div>
    <button class="side-btn" id="terrainBtn" onclick="toggleTerrainMode()" style="margin-top:4px;">地形編集</button>
    <div class="dpc-side-row">
      <button class="side-btn" style="flex:1;" onclick="if(!gameOver)openDpc()">DPC<br>セット</button>
      <button class="side-btn again" id="dpcAgainBtn" onclick="if(!gameOver)repeatDpc()">↻</button>
    </div>
    <button class="side-btn" id="dekaModeBtn" onclick="toggleDekaMode()" style="margin-top:4px;">デカミノ<br>モード</button>
    <button class="side-btn" id="renModeBtn" onclick="toggleRenMode()" style="margin-top:4px;">REN<br>モード</button>
    <button class="side-btn" id="digBtn" onclick="toggleDigMode()" style="margin-top:4px;">せりあがり</button>
    <div id="dig-info"></div>
    <div class="di-row" id="diRow" style="display:none;">
      <button class="di-btn" onclick="changeDigInterval(-1)">‹</button>
      <div class="di-val"><span id="digIntervalVal">3</span><br><span style="font-size:8px;color:#6b7280;">個ごと</span></div>
      <button class="di-btn" onclick="changeDigInterval(+1)">›</button>
    </div>
    <div id="holeRow" style="display:none;width:100%;">
      <div class="m-lbl" style="margin:4px 0 0;">穴継続率</div>
      <div class="di-row" style="margin-top:0;">
        <button class="di-btn" onclick="stepOption('holeKeep',-1)">‹</button>
        <div class="di-val"><span id="optHoleKeepVal">10</span> %</div>
        <button class="di-btn" onclick="stepOption('holeKeep',1)">›</button>
      </div>
    </div>
    <button class="side-btn" onclick="openShot()" style="margin-top:4px;">カンペ<br>画像</button>
    <button class="side-btn" onclick="startGame()"
      style="margin-top:4px;background:#7f1d1d;border-color:#ef4444;color:#fff;">リセット</button>
    <!-- デモ版でだけ出る版切り替え（本番では非表示） -->
    <button class="side-btn" id="verSwitchBtn" style="display:none;margin-top:4px;"
      onclick="switchVersion()">🖥 PC版<br>へ</button>
    <div id="verLabel"></div>
  </div>

  <!-- 中央: ボード + コントロール + オプション -->
  <div id="center-col">
    <div id="stats-bar">
      <div class="stat-col">
        <div class="stat-lbl">SCORE</div>
        <div class="stat-val" id="scoreEl">0</div>
      </div>
      <div class="stat-col">
        <div class="stat-lbl">LV</div>
        <div class="stat-val" id="levelEl">1</div>
      </div>
      <div class="stat-col">
        <div class="stat-lbl">LINE</div>
        <div class="stat-val" id="linesEl">0</div>
      </div>
    </div>

    <canvas id="boardCanvas"></canvas>

    <div class="ctrl-pad" id="ctrlPad">
      <div class="ctrl-row r3">
        <button class="ctrl-btn" id="btnLeft"
          onmousedown="if(!gameOver){moveH(-1);startDAS('L')}"
          onmouseup="stopDAS()" onmouseleave="stopDAS()">
          ←<span class="ctrl-lbl">左</span>
        </button>
        <button class="ctrl-btn" id="btnSoft"
          onmousedown="if(!gameOver)startSoftDropBtn()"
          onmouseup="stopSoftDropBtn()" onmouseleave="stopSoftDropBtn()">
          ↓<span class="ctrl-lbl">ソフト</span>
        </button>
        <button class="ctrl-btn" id="btnRight"
          onmousedown="if(!gameOver){moveH(1);startDAS('R')}"
          onmouseup="stopDAS()" onmouseleave="stopDAS()">
          →<span class="ctrl-lbl">右</span>
        </button>
      </div>
      <div class="ctrl-row r2">
        <button class="ctrl-btn"
          onmousedown="if(!gameOver)rotate(-1)"
          ontouchstart="e.preventDefault();if(!gameOver)rotate(-1)">
          ↺<span class="ctrl-lbl">左回転</span>
        </button>
        <button class="ctrl-btn"
          onmousedown="if(!gameOver)rotate(1)"
          ontouchstart="e.preventDefault();if(!gameOver)rotate(1)">
          ↻<span class="ctrl-lbl">右回転</span>
        </button>
      </div>
      <div class="ctrl-row r2">
        <button class="ctrl-btn ctrl-hold" onclick="if(!gameOver)doHold()">
          ⇪<span class="ctrl-lbl">HOLD</span>
        </button>
        <button class="ctrl-btn ctrl-hard" onclick="if(!gameOver)hardDrop()">
          ⬇<span class="ctrl-lbl">DROP</span>
        </button>
      </div>
    </div>

    <div id="opts">
      <button class="opt-btn"
        onclick="if(!gameOver)discardPiece()">ミノ捨てる</button>
      <button class="opt-btn"
        onclick="if(!gameOver&&undoStack.length)undo()">戻す ↩</button>
    </div>
    <div id="colorPaletteWrap"></div>
  </div>

  <!-- 右: NEXT -->
  <div class="side-col" id="rightCol">
    <div class="mini-panel" style="padding:5px 3px;">
      <div class="m-lbl">NEXT</div>
      <canvas id="nextCanvas"></canvas>
    </div>
    <div id="clearMsg"></div>
  </div>

</div>

<!-- カンペ画像：貼り付け用ダイアログ -->
<div id="shotOverlay">
  <div id="shotDialog">
    <h2>カンペ画像</h2>
    <div class="sub2">画像を画面に重ねて表示します。<br>表示後は位置とサイズを変えられます</div>
    <div id="shotDrop">
      ここをタップして画像を選ぶ<br>
      <span style="font-size:10px;color:#9ca3af;">ドラッグ＆ドロップ／貼り付けも可</span>
    </div>
    <input type="file" id="shotFile" accept="image/*" style="display:none">
    <div class="shot-act" id="shotCtrls" style="display:none;">
      <button onclick="pinAllShots()">すべて最前面に</button>
      <button onclick="closeAllShots(); closeShot();">すべて消す</button>
    </div>
    <div class="shot-act">
      <button onclick="closeShot()">閉じる</button>
    </div>
  </div>
</div>

<!-- DPCセット: HOLDに入れるミノを選ぶ -->
<div id="dpcOverlay">
  <div id="dpcPanel">
    <h2>DPCセット</h2>
    <div class="sub2">選んだミノをHOLDした状態にして、<br>地形とミノの順番をリセットします</div>
    <div id="dpcGrid"></div>
    <button class="dpc-close" onclick="closeDpc()">キャンセル</button>
  </div>
</div>

<div id="overlay">
  <h1>テト練（β版）<br><span style="font-size:13px;color:#6b7280;">スマホ版</span></h1>
  <div class="sub">タッチ操作でプレイ</div>
  <button id="startBtn">スタート</button>
</div>

<script>
// ===== 定数 =====
const COLS = 10, ROWS = 20, BUF = 4, TROW = ROWS + BUF;
const NEXT_SHOW = 5;
const GARBAGE_COLOR = '#4b5563';
let BS = 22; // 後で動的設定

// ===== ピース定義 =====
const PIECE_DEF = {
  I:{ color:'#22d3ee', cells:[[[1,0],[1,1],[1,2],[1,3]],[[0,2],[1,2],[2,2],[3,2]],[[2,0],[2,1],[2,2],[2,3]],[[0,1],[1,1],[2,1],[3,1]]], spawnCol:3,spawnRow:BUF-1,kickType:'I' },

// ===== バッグ =====
function newBag() {
  const a=['I','O','T','S','Z','J','L'];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function fillQ() {
  while(nextQ.length < NEXT_SHOW+1){
    const isNew=(bag.length===0); if(isNew) bag=newBag();
    nextQ.push({type:bag.shift(), newBag:isNew});
  }
}

// ===== デカミノモード 論理座標定数 =====
const DEKA_LCOLS = 5;
const DEKA_LTROW = TROW / 2; // = 12

// ===== ピース生成 =====
function mkPiece(type){
  const d=PIECE_DEF[type];
  if(dekaMode) return{type,state:0,row:BUF/2-1,col:type==='I'?0:1};
  return{type,state:0,row:d.spawnRow,col:d.spawnCol};
}
function spawn(){
  fillQ(); cur=mkPiece(nextQ.shift().type);
  canHold=true; lastWasRotation=false; lastKickIndex=0;
  if(!valid(cur,0,0,cur.state)){gameOver=true;setTimeout(()=>showOverlay('ゲームオーバー','もう一度'),100);}
}

// ===== 衝突判定 =====
// デカミノモードでは cur.row/col は論理座標（5×10）
function valid(p,dr,dc,st){
  const cells=PIECE_DEF[p.type].cells[st];
  if(dekaMode){
    for(const[r,c] of cells){
      const lr=p.row+r+dr,lc=p.col+c+dc;
      if(lc<0||lc>=DEKA_LCOLS||lr>=DEKA_LTROW) return false;
      if(lr<0) continue;
      const ar=lr*2,ac=lc*2;
      if(board[ar][ac]||board[ar][ac+1]||board[ar+1][ac]||board[ar+1][ac+1]) return false;
    }
    return true;
  }
  for(const[r,c] of cells){
    const nr=p.row+r+dr,nc=p.col+c+dc;
    if(nc<0||nc>=COLS||nr>=TROW) return false;
    if(nr>=0&&board[nr][nc]) return false;
  }
  return true;
}

// ===== ゴースト =====
function ghostRow(){let g=cur.row;while(valid({...cur,row:g+1},0,0,cur.state))g++;return g;}

// ===== 移動 =====
function moveH(dc){if(valid(cur,0,dc,cur.state)){cur.col+=dc;lastWasRotation=false;resetLock();draw();}}
function softDrop(){if(valid(cur,1,0,cur.state)){cur.row++;score++;resetLock();draw();return true;}return false;}
function hardDrop(){let d=0;while(valid(cur,1,0,cur.state)){cur.row++;d++;}score+=d*2;lock();}

// ===== 回転 (SRS) =====
// デカミノモードでも論理座標なのでSRS通常通り動作
function rotate(dir){
  const from=cur.state, to=(from+(dir===1?1:3))%4;
  const key=STATE_NAMES[from]+STATE_NAMES[to];
  const kicks=KICKS[PIECE_DEF[cur.type].kickType][key]||[[0,0]];
  for(let ki=0;ki<kicks.length;ki++){
    const[dc,dr]=kicks[ki];
    if(valid(cur,dr,dc,to)){cur.state=to;cur.row+=dr;cur.col+=dc;lastWasRotation=true;lastKickIndex=ki;resetLock();draw();return;}
  }
}

// ===== ホールド =====
function doHold(){
  // 連続HOLDがOFFのときは、ミノを置くまで再ホールドできない（通常のテトリスと同じ）
  if(!opts.multiHold && !canHold) return;
  if(holdType===null){holdType=cur.type;spawn();}
  else{const t=holdType;holdType=cur.type;cur=mkPiece(t);}
  canHold=false;   // spawn() 側で次のミノ出現時に戻る
  resetLock();draw();
}

function getTerrainCellFromPoint(clientX, clientY){
  const rect = boardCanvas.getBoundingClientRect();
  const col = Math.floor((clientX - rect.left)  / BS);
  const row = Math.floor((clientY - rect.top) / BS) + BUF;
  if(col<0||col>=COLS||row<BUF||row>=TROW) return null;
  return {row, col};
}

// ===== オート（なぞった形のミノになる）=====
// 1マス目は自由、2マス目以降は置いたマスの上下左右のみ。
// 4マス揃った時点で、その形に一致するミノの色へ塗り替えてリセットする。
let autoGroup = [];
const AUTO_SHAPES = {};
(function buildAutoShapes(){
  const key = cells => {
    const mr=Math.min(...cells.map(c=>c[0])), mc=Math.min(...cells.map(c=>c[1]));
    return cells.map(([r,c])=>(r-mr)+','+(c-mc)).sort().join(' ');
  };
  for(const t in PIECE_DEF) for(const st of PIECE_DEF[t].cells) AUTO_SHAPES[key(st)]=t;
  AUTO_SHAPES._key = key;
})();
function autoIsAdjacent(row,col){
  return autoGroup.some(([r,c])=>Math.abs(r-row)+Math.abs(c-col)===1);
}
// 置けたらtrue
function applyAutoAt(row,col){
  if(board[row][col]) return false;   // 既にある場所は素通り（削除は消去モード側）
  if(autoGroup.length>0 && !autoIsAdjacent(row,col)) return false;
  board[row][col] = GARBAGE_COLOR;
  autoGroup.push([row,col]);
  if(autoGroup.length===4){
    const type = AUTO_SHAPES[AUTO_SHAPES._key(autoGroup)];
    if(type){ const col2=PIECE_DEF[type].color; for(const[r,c] of autoGroup) board[r][c]=col2; }
    autoGroup = [];   // 次はまたどこからでも置ける
  }
  return true;
}

function applyTerrainAt(col, row){
  if(terrainColor==='AUTO'){
    if(terrainPaintMode==='erase'){
      if(!board[row][col]) return;
      board[row][col] = null;
      autoGroup = autoGroup.filter(([r,c])=>!(r===row&&c===col));
    } else if(!applyAutoAt(row,col)){
      return;   // 置けない場所だったので何もしない
    }
    draw(); return;
  }
  if(terrainPaintMode==='set') board[row][col] = terrainColor;
  else                          board[row][col] = null;
  draw();
}

// ===== ボードタッチ操作 =====
let touchStartX=0, touchStartY=0, touchStartTime=0;
let touchGesture=null; // null|'left'|'right'|'hardDrop'|'hold'|'softDrop'
let touchLoopTimer=null, touchLongPressTimer=null, touchDasTimer=null;
let touchPeakX=0;

const SWIPE_H    = 20;  // 左右初動判定距離(px)
const SWIPE_V    = 50;  // 上下判定距離(px)
const SWIPE_REV  = 28;  // 方向転換判定距離(px)
const DAS_DELAY  = 200; // 連続移動開始遅延(ms)
const LONG_PRESS = 250; // 長押し判定(ms)
const MOVE_ITV   = 80;  // 連続移動間隔(ms)
const SOFT_ITV   = 55;  // ソフトドロップ間隔(ms)

function stopTouchLoops(){
  if(touchLoopTimer){clearInterval(touchLoopTimer);touchLoopTimer=null;}
  if(touchLongPressTimer){clearTimeout(touchLongPressTimer);touchLongPressTimer=null;}
  if(touchDasTimer){clearTimeout(touchDasTimer);touchDasTimer=null;}
}

// 1マス移動 → DAS後に連続移動開始
function beginHMove(dir, curX){
  if(touchLoopTimer){clearInterval(touchLoopTimer);touchLoopTimer=null;}
  if(touchDasTimer){clearTimeout(touchDasTimer);touchDasTimer=null;}
  touchGesture = dir < 0 ? 'left' : 'right';
  touchPeakX = curX;
  if(!gameOver){ moveH(dir); draw(); }
  touchDasTimer = setTimeout(() => {
    touchDasTimer = null;
    touchLoopTimer = setInterval(() => { if(!gameOver){ moveH(dir); draw(); } }, MOVE_ITV);
  }, DAS_DELAY);
}

boardCanvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  if(terrainMode){
    const cell = getTerrainCellFromPoint(t.clientX, t.clientY);
    if(!cell) return;
    terrainPaintMode = board[cell.row][cell.col] ? 'erase' : 'set';
    terrainPainting = true;
    applyTerrainAt(cell.col, cell.row);
    return;
  }
  touchStartX = t.clientX; touchStartY = t.clientY;
  touchStartTime = Date.now();
  touchGesture = null;
  touchPeakX = t.clientX;
  touchLongPressTimer = setTimeout(() => {
    if(touchGesture === null && !gameOver){
      touchGesture = 'softDrop';
      softDrop(); draw();
      touchLoopTimer = setInterval(() => { if(!gameOver){ softDrop(); draw(); } }, SOFT_ITV);
    }
  }, LONG_PRESS);
}, {passive:false});

boardCanvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if(terrainMode){
    if(!terrainPainting) return;
    const t = e.touches[0];
    const cell = getTerrainCellFromPoint(t.clientX, t.clientY);
    if(cell) applyTerrainAt(cell.col, cell.row);
    return;
  }
  if(touchGesture === 'hardDrop' || touchGesture === 'hold') return;
  const t = e.touches[0];
  const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
  const adx = Math.abs(dx), ady = Math.abs(dy);

  // 長押し中に左右スワイプ → ソフトドロップ解除して移動へ
  if(touchGesture === 'softDrop'){
    if(adx >= SWIPE_H && adx > ady){
      stopTouchLoops();
      touchGesture = null;
      beginHMove(dx < 0 ? -1 : 1, t.clientX);
    }
    return;
  }

  // 左右移動中：方向転換チェック
  if(touchGesture === 'left' || touchGesture === 'right'){
    const curX = t.clientX;
    const gdir = touchGesture === 'left' ? -1 : 1;
    if(gdir < 0 && curX < touchPeakX) touchPeakX = curX;
    if(gdir > 0 && curX > touchPeakX) touchPeakX = curX;
    const reversal = gdir < 0 ? curX - touchPeakX : touchPeakX - curX;
    if(reversal >= SWIPE_REV) beginHMove(-gdir, curX);
    return;
  }

  // 初動判定
  if(adx >= SWIPE_H && adx > ady){
    // 左右スワイプ：1マス移動 → DASで連続
    if(touchLongPressTimer){clearTimeout(touchLongPressTimer);touchLongPressTimer=null;}
    beginHMove(dx < 0 ? -1 : 1, t.clientX);
  } else if(dy >= SWIPE_V && ady > adx){
    // 下スワイプ → ハードドロップ
    stopTouchLoops();
    touchGesture = 'hardDrop';
    if(!gameOver) hardDrop();
  } else if(dy <= -SWIPE_V && ady > adx){
    // 上スワイプ → ホールド
    stopTouchLoops();
    touchGesture = 'hold';
    if(!gameOver) doHold();
  }
}, {passive:false});

boardCanvas.addEventListener('touchend', e => {
  if(terrainMode){ terrainPainting = false; return; }
  stopTouchLoops();
  // タップ判定：動きが小さく短時間
  const elapsed = Date.now() - touchStartTime;
  if(touchGesture === null && elapsed < 300 && !gameOver){
    const rect = boardCanvas.getBoundingClientRect();
    const tapX = touchStartX - rect.left;
    if(tapX >= rect.width / 2) rotate(1); else rotate(-1);
  }
  touchGesture = null;
});
boardCanvas.addEventListener('touchcancel', () => {
  stopTouchLoops(); terrainPainting = false; touchGesture = null;
});

// ===== 掘り練習 =====
function changeDigInterval(delta){
  digInterval=Math.min(20,Math.max(1,digInterval+delta));
  document.getElementById('digIntervalVal').textContent=digInterval;
  updateDigCounter();
  saveDigSetting();
}

// せりあがりの間隔設定は、リセットしてもページを閉じても保持する。
// 保存先はPC版と同じ tetren_dig（スマホ版が使うのは「個ごと」の値だけ）
function saveDigSetting(){
  let d = {};
  try { d = JSON.parse(localStorage.getItem('tetren_dig')) || {}; } catch(e) {}
  d.mino = digInterval;
  try { localStorage.setItem('tetren_dig', JSON.stringify(d)); } catch(e) {}
}
function loadDigSetting(){
  let raw=null;
  try { raw = localStorage.getItem('tetren_dig'); } catch(e) {}
  if(raw){
    try {
      const d = JSON.parse(raw);
      if(Number.isFinite(d.mino)) digInterval = Math.min(20, Math.max(1, d.mino));
    } catch(e) {}
  }
  const el = document.getElementById('digIntervalVal');
  if(el) el.textContent = digInterval;
}
function toggleDigMode(){
  digMode=!digMode; digCount=0;
  const btn=document.getElementById('digBtn');
  const diRow=document.getElementById('diRow');
  if(digMode){
    btn.textContent='せりあがり';
    btn.style.cssText='background:#0891b2;border-color:#06b6d4;color:#fff;';
    diRow.style.display='flex';
    document.getElementById('holeRow').style.display='block';

      rb.style.background=''; rb.style.borderColor=''; rb.style.color='';
      for(let r=BUF;r<TROW;r++) for(let c=0;c<COLS;c++) board[r][c]=null;
      ren=0; draw();
    }
    // デカミノモードを強制OFF
    if(dekaMode){
      dekaMode=false;
      document.getElementById('dekaModeBtn').style.background='';
      for(let r=BUF;r<TROW;r++) for(let c=0;c<COLS;c++) board[r][c]=null;
      spawn(); draw();

  } else {
    btn.textContent='せりあがり';
    btn.style.cssText='';
    diRow.style.display='none';
    document.getElementById('holeRow').style.display='none';
  }
  updateDigCounter();
}
function updateDigCounter(){
  const el=document.getElementById('dig-info');
  if(!digMode){el.textContent='';return;}
  const next=digInterval-(digCount%digInterval);
  el.innerHTML=`あと<br><strong style="font-size:14px;color:#e2e8f0;">${next}</strong><br>個で競り上げ`;
}

// ===== おじゃま =====
// 積み上がりすぎ判定: 真ん中4列が21段目以上まで到達したら終了
const MID_COL_L = Math.floor((COLS-4)/2), MID_COL_R = MID_COL_L+3;
function isStackOverflow(){
  for(let r=0;r<BUF;r++) for(let c=MID_COL_L;c<=MID_COL_R;c++) if(board[r][c]) return true;
  return false;
}
function addGarbage(sameHole){
  // 穴の列を決定。sameHole=true は必ず同じ列、
  // 自動せりあがりは「穴継続率」の確率で同じ列を使う
  let holeCol;
  if(lastGarbageCol===null){
    holeCol=Math.floor(Math.random()*COLS);
  } else if(sameHole===true || Math.random()*100 < opts.holeKeep){
    holeCol=lastGarbageCol;
  } else {
    // 外れたときは「直前以外」から選ぶ。10列なので10%＝完全ランダムと一致する
    const others=[];
    for(let i=0;i<COLS;i++) if(i!==lastGarbageCol) others.push(i);
    holeCol=others[Math.floor(Math.random()*others.length)];
  }
  lastGarbageCol=holeCol;
  board.shift();
  const g=new Array(COLS).fill(GARBAGE_COLOR); g[holeCol]=null;
  board.push(g);
  let escaped=true;
  if(!valid(cur,0,0,cur.state)){
    cur.row--;
    while(!valid(cur,0,0,cur.state)&&cur.row>0)cur.row--;
    escaped=valid(cur,0,0,cur.state);   // 上端でも逃がせなければ詰み
  }
  resetLock();draw();
  // せりあがりで積み上がりすぎたらゲームオーバー（ミノを置かないままでも判定される）
  if(!gameOver&&(!escaped||isStackOverflow())){
    gameOver=true;
    setTimeout(()=>showOverlay('ゲームオーバー','もう一度'),100);
  }
}

// ===== スナップショット =====
function saveSnapshot(){
  undoStack.push({board:board.map(r=>[...r]),cur:{...cur},holdType,canHold,bag:[...bag],nextQ:[...nextQ],score,level,lines,b2b,ren,dropInterval,digCount});
  if(undoStack.length>UNDO_MAX) undoStack.shift();
}

// ===== Undo =====
function undo(){
  if(!undoStack.length) return;
  const s=undoStack.pop(); resetLock();
  board=s.board; cur=mkPiece(s.cur.type); holdType=s.holdType; canHold=s.canHold;
  bag=s.bag; nextQ=s.nextQ; score=s.score; level=s.level; lines=s.lines;
  b2b=s.b2b; ren=s.ren; dropInterval=s.dropInterval; digCount=s.digCount; lastDrop=0;
  updUI(); updateDigCounter(); draw();
}

// ===== ロック処理 =====
function lock(){
  if(lockTimer){clearTimeout(lockTimer);lockTimer=null;} isLocking=false;
  saveSnapshot();
  const tSpin=detectTSpin();
  lastWasRotation=false;
  const col_=PIECE_DEF[cur.type].color;
  if(dekaMode){
    for(const[r,c] of PIECE_DEF[cur.type].cells[cur.state]){
      const lr=cur.row+r,lc=cur.col+c;
      if(lr>=0){const ar=lr*2,ac=lc*2;board[ar][ac]=board[ar][ac+1]=board[ar+1][ac]=board[ar+1][ac+1]=col_;}
    }
  } else {
    for(const[r,c] of PIECE_DEF[cur.type].cells[cur.state]){
      const nr=cur.row+r,nc=cur.col+c; if(nr>=0) board[nr][nc]=col_;
    }
  }
  const cleared=clearLines();
  if(renMode) restoreRenWalls();
  const isPerfect=cleared>0&&board.every(row=>row.every(v=>!v));
  if(cleared>0){ren++;}else{ren=0;}
  addScore(cleared,tSpin,isPerfect);
  if(digMode){digCount++;updateDigCounter();if(digCount%digInterval===0)addGarbage(false);}
  spawn(); draw();
}

// ===== ライン消去 =====
function clearLines(){
  if(dekaMode){
    let n=0;
    for(let lr=DEKA_LTROW-1;lr>=0;lr--){
      const ar=lr*2;
      if(board[ar].every(v=>v)&&board[ar+1].every(v=>v)){
        board.splice(ar,2);
        board.unshift(new Array(COLS).fill(null));
        board.unshift(new Array(COLS).fill(null));
        n++;lr++;
      }
    }
    return n;
  }
  let n=0;
  for(let r=TROW-1;r>=0;r--){if(board[r].every(v=>v)){board.splice(r,1);board.unshift(new Array(COLS).fill(null));n++;r++;}}
  return n;
}

// ===== Tスピン判定 =====
// デカミノモードでは cur.row/col が論理座標なのでオフセット+2は共通
function detectTSpin(){
  if(cur.type!=='T'||!lastWasRotation) return null;
  const r=cur.row,c=cur.col;
  function isBlocked(row,col){
    if(dekaMode){
      if(col<0||col>=DEKA_LCOLS||row>=DEKA_LTROW) return true;
      if(row<0) return false;
      const ar=row*2,ac=col*2;
      return !!(board[ar][ac]||board[ar][ac+1]||board[ar+1][ac]||board[ar+1][ac+1]);
    }
    if(col<0||col>=COLS||row>=TROW) return true;
    if(row<0) return false;
    return !!board[row][col];
  }
  const corners=[isBlocked(r,c),isBlocked(r,c+2),isBlocked(r+2,c),isBlocked(r+2,c+2)];
  if(corners.filter(Boolean).length<3) return null;
  const frontIdx=[[0,1],[1,3],[2,3],[0,2]][cur.state];
  const frontFilled=frontIdx.filter(i=>corners[i]).length;
  if(frontFilled===2||lastKickIndex===4) return 'full';
  return 'mini';
}

// ===== クリアメッセージ =====
function showClearMessage(cleared,tSpin,isB2B,renCount,isPerfect){
  if(!cleared&&!tSpin&&!isPerfect) return;
  const el=document.getElementById('clearMsg');
  let mainText='',mainColor='#fff';
  if(isPerfect){
    mainText='PERFECT<br>CLEAR'; mainColor='#fbbf24';
  } else if(tSpin){
    const base=tSpin==='mini'?'T-SPIN MINI':'T-SPIN';
    const cnt=['','SINGLE','DOUBLE','TRIPLE'][cleared]||'';
    mainText=cnt?`${base}<br>${cnt}`:base;
    mainColor=tSpin==='mini'?'#c4b5fd':'#a855f7';
  } else if(cleared===4){
    mainText='TETRIS'; mainColor='#22d3ee';
  } else {
    mainText=['','1 LINE','2 LINE','3 LINE'][cleared]||`${cleared} LINE`;
    mainColor='#9ca3af';
  }
  let subs='';
  if(isB2B) subs+=`<div style="font-size:9px;color:#fbbf24;font-weight:bold;">BACK TO BACK</div>`;
  if(renCount>=2) subs+=`<div style="font-size:9px;color:#fb923c;font-weight:bold;">REN ×${renCount-1}</div>`;
  el.innerHTML=`<div style="font-size:${isPerfect?'13px':'16px'};font-weight:bold;color:${mainColor};text-shadow:0 1px 6px rgba(0,0,0,0.9);line-height:1.2;">${mainText}</div>`+subs;
  el.style.opacity='1';
  if(clearMsgTimer) clearTimeout(clearMsgTimer);
  clearMsgTimer=setTimeout(()=>{el.style.opacity='0';},4000);
}

const REN_TBL=[0,100,100,200,200,300,300,400,400,400,400,400];
const TSPIN_FULL=[400,800,1200,1600];
const TSPIN_MINI=[100,200,400,0];

// ===== スコア =====
function addScore(cleared,tSpin,isPerfect){
  if(!cleared&&!tSpin){return;}
  const isHard=(cleared===4)||(tSpin&&cleared>0);
  const isB2B=isHard&&b2b;
  let base=0;
  if(tSpin==='full') base=(TSPIN_FULL[cleared]??0)*level;
  else if(tSpin==='mini') base=(TSPIN_MINI[cleared]??0)*level;
  else base=(SCORE_TABLE[cleared]??0)*level;
  if(isB2B) base=Math.floor(base*1.5);
  score+=base;
  if(cleared>0&&ren>=1) score+=REN_TBL[Math.min(ren,11)]*level;
  if(isPerfect) score+=3500*level;
  if(cleared>0){
    lines+=cleared; level=Math.floor(lines/10)+1;
    dropInterval=Math.max(50,1000-(level-1)*90);
    b2b=isHard;
  }
  updUI();
  showClearMessage(cleared,tSpin,isB2B,ren,isPerfect);
}
function updUI(){
  document.getElementById('scoreEl').textContent=score.toLocaleString();
  document.getElementById('levelEl').textContent=level;
  document.getElementById('linesEl').textContent=lines;
}

// ===== 中空けRENモード =====
function setupRenTerrain(){
  for(let r=0;r<TROW;r++) for(let c=0;c<COLS;c++) board[r][c]=null;
  for(let r=REN_WALL_TOP;r<TROW;r++) for(const c of REN_WALL_COLS) board[r][c]=GARBAGE_COLOR;
  board[TROW-1][3]=GARBAGE_COLOR;
  board[TROW-1][4]=GARBAGE_COLOR;
  board[TROW-1][5]=GARBAGE_COLOR;
}
function restoreRenWalls(){
  for(let r=REN_WALL_TOP;r<TROW;r++) for(const c of REN_WALL_COLS) board[r][c]=GARBAGE_COLOR;
}
function toggleDekaMode(){

    }

  } else {
    btn.style.background=''; btn.style.borderColor=''; btn.style.color='';
    for(let r=BUF;r<TROW;r++) for(let c=0;c<COLS;c++) board[r][c]=null;

// ===== 描画 =====
function drawBlock(ctx,c,r,color,alpha=1){
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.fillStyle=color; ctx.fillRect(c*BS+1,r*BS+1,BS-2,BS-2);
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.fillRect(c*BS+1,r*BS+1,BS-2,4); ctx.fillRect(c*BS+1,r*BS+1,4,BS-2);
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.fillRect(c*BS+1,r*BS+BS-5,BS-2,4); ctx.fillRect(c*BS+BS-5,r*BS+1,4,BS-2);
  ctx.restore();
}
// デカミノモード用: 論理セル1つを2BS×2BSの大きなブロックとして描画
function drawBigBlock(ctx,c,r,color,alpha=1){
  const sz=BS*2;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.fillStyle=color; ctx.fillRect(c*BS+1,r*BS+1,sz-2,sz-2);
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.fillRect(c*BS+1,r*BS+1,sz-2,6); ctx.fillRect(c*BS+1,r*BS+1,6,sz-2);
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.fillRect(c*BS+1,r*BS+sz-7,sz-2,6); ctx.fillRect(c*BS+sz-7,r*BS+1,6,sz-2);
  ctx.restore();
}

function drawBoard(){
  boardCtx.fillStyle='#0d1117'; boardCtx.fillRect(0,0,COLS*BS,ROWS*BS);
  boardCtx.strokeStyle='#1f2937'; boardCtx.lineWidth=0.5;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) boardCtx.strokeRect(c*BS,r*BS,BS,BS);
  // 固定ブロック
  if(dekaMode){
    for(let r=BUF;r<TROW;r+=2) for(let c=0;c<COLS;c+=2)
      if(board[r][c]) drawBigBlock(boardCtx,c,r-BUF,board[r][c]);
  } else {
    for(let r=BUF;r<TROW;r++) for(let c=0;c<COLS;c++) if(board[r][c]) drawBlock(boardCtx,c,r-BUF,board[r][c]);
  }
  if(!gameOver&&showGhost){
    const gr=ghostRow(),cells=PIECE_DEF[cur.type].cells[cur.state],color=PIECE_DEF[cur.type].color;
    if(dekaMode){
      for(const[r,c] of cells){const vr0=(gr+r)*2-BUF,vc0=(cur.col+c)*2;if(vr0+1>=0)drawBigBlock(boardCtx,vc0,Math.max(vr0,0),color,0.2);}
    } else {
      for(const[r,c] of cells){const vr=gr+r-BUF,vc=cur.col+c;if(vr>=0)drawBlock(boardCtx,vc,vr,color,0.2);}
    }
  }
  if(!gameOver){
    const cells=PIECE_DEF[cur.type].cells[cur.state],color=PIECE_DEF[cur.type].color;
    if(dekaMode){
      for(const[r,c] of cells){const vr0=(cur.row+r)*2-BUF,vc0=(cur.col+c)*2;if(vr0>=-1)drawBigBlock(boardCtx,vc0,Math.max(vr0,0),color);}
    } else {
      for(const[r,c] of cells){const vr=cur.row+r-BUF,vc=cur.col+c;if(vr>=0)drawBlock(boardCtx,vc,vr,color);}
    }
  }
  // 軸表示
  if(showAxis&&!gameOver){
    let ax,ay;
    if(dekaMode){
      const vr2=cur.row*2-BUF,vc2=cur.col*2;
      if(cur.type==='I'){ax=(vc2+4)*BS;ay=(vr2+4)*BS;}
      else if(cur.type==='O'){ax=(vc2+2)*BS;ay=(vr2+2)*BS;}
      else{ax=(vc2+2)*BS+BS;ay=(vr2+2)*BS+BS;}
    } else {
      const vr=cur.row-BUF,vc=cur.col;
      if(cur.type==='I'){ax=(vc+2)*BS;ay=(vr+2)*BS;}
      else if(cur.type==='O'){ax=(vc+1)*BS;ay=(vr+1)*BS;}
      else{ax=(vc+1)*BS+BS/2;ay=(vr+1)*BS+BS/2;}
    }
    if(ay>=0){
      boardCtx.save();
      boardCtx.fillStyle='rgba(0,0,0,0.85)';
      boardCtx.strokeStyle='rgba(255,255,255,0.9)';
      boardCtx.lineWidth=1.5;
      boardCtx.beginPath();
      boardCtx.arc(ax,ay,5,0,Math.PI*2);
      boardCtx.fill();
      boardCtx.stroke();
      boardCtx.restore();
    }
  }
}

function drawMini(ctx,type,yOff,w,h){
  if(!type) return;
  const cells=PIECE_DEF[type].cells[0],color=PIECE_DEF[type].color;
  const minC=Math.min(...cells.map(c=>c[1])),maxC=Math.max(...cells.map(c=>c[1]));
  const minR=Math.min(...cells.map(c=>c[0])),maxR=Math.max(...cells.map(c=>c[0]));
  const bw=maxC-minC+1,bh=maxR-minR+1;
  const bs=Math.min(Math.floor((w-4)/(bw)),Math.floor((h-4)/(bh)),15);
  const sx=Math.floor((w-bw*bs)/2),sy=yOff+Math.floor((h-bh*bs)/2);
  ctx.save();
  for(const[r,c] of cells){
    const px=sx+(c-minC)*bs,py=sy+(r-minR)*bs;
    ctx.fillStyle=color; ctx.fillRect(px+1,py+1,bs-2,bs-2);
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.fillRect(px+1,py+1,bs-2,3); ctx.fillRect(px+1,py+1,3,bs-2);
  }
  ctx.restore();
}

function drawHold(){
  holdCtx.fillStyle='#0d1117'; holdCtx.fillRect(0,0,holdCanvas.width,holdCanvas.height);
  drawMini(holdCtx,holdType,0,holdCanvas.width,holdCanvas.height);
}

function drawNext(){
  nextCtx.fillStyle='#0d1117'; nextCtx.fillRect(0,0,nextCanvas.width,nextCanvas.height);
  fillQ();
  const itemH=Math.floor(nextCanvas.height/NEXT_SHOW);
  for(let i=0;i<NEXT_SHOW;i++){
    const item=nextQ[i];
    if(item.newBag&&i>0){
      const y=i*itemH-3;
      nextCtx.save();
      nextCtx.strokeStyle='rgba(129,140,248,0.6)'; nextCtx.lineWidth=1.5;
      nextCtx.beginPath(); nextCtx.moveTo(4,y); nextCtx.lineTo(nextCanvas.width-4,y); nextCtx.stroke();
      nextCtx.restore();
    }
    drawMini(nextCtx,item.type,i*itemH,nextCanvas.width,itemH);
  }
}

function draw(){drawBoard();drawHold();drawNext();}

}

// ===== ボタンの長押し連射 =====
let repeatTimer = null;
function startRepeat(fn){
  stopRepeat();
  fn();                                   // まず1回（単押しはこれだけ）
  let interval = 130;                     // 連射の初期間隔(ms)
  const tick = () => {
    fn();
    interval = Math.max(25, interval * 0.85);   // 押し続けるほど加速
    repeatTimer = setTimeout(tick, interval);
  };
  repeatTimer = setTimeout(tick, 400);    // 長押しと判定するまでの待ち
}
function stopRepeat(){
  if(repeatTimer){ clearTimeout(repeatTimer); repeatTimer = null; }
}
// ボタンの外で指を離した場合にも確実に止める

window.addEventListener('touchend', stopRepeat);

window.addEventListener('blur', stopRepeat);

// ===== 落下設定（PC版と同じ 0G〜20G） =====
// 1G = 1行/秒、20G = 1フレームで最下段。間は等比で補間する
const GRAV_MIN_ROWS = 1 / 60;
const GRAV_MAX_ROWS = TROW;
function gravRowsPerFrame(g){
  if(g <= 1)  return GRAV_MIN_ROWS;
  if(g >= 20) return GRAV_MAX_ROWS;
  return GRAV_MIN_ROWS * Math.pow(GRAV_MAX_ROWS / GRAV_MIN_ROWS, (g - 1) / 19);
}
function updateGravDisplay(){
  const el = document.getElementById('gravSpeedVal');
  if(el) el.textContent = gravSpeed;
}
// 落下速度はリセットしてもページを閉じても保持する
function saveGravSpeed(){
  try { localStorage.setItem('tetren_grav', String(gravSpeed)); } catch(e) {}
}
function loadGravSpeed(){
  let raw = null;
  try { raw = localStorage.getItem('tetren_grav'); } catch(e) {}
  const v = parseInt(raw, 10);
  gravSpeed = (Number.isFinite(v) && v >= 0 && v <= 20) ? v : 0;
  updateGravDisplay();
}
function changeGravSpeed(delta){
  gravSpeed = Math.min(20, Math.max(0, gravSpeed + delta));
  updateGravDisplay();
  saveGravSpeed();
  lastDrop = 0; gravAccum = 0;
}

// ===== ゲームループ =====
let rafId;
function loop(ts){
  if(gameOver) return;
  if(downHeld&&ts-lastSoftDrop>=SOFT_DROP_RATE){softDrop();lastSoftDrop=ts;}
  // 0G は自由落下しない。1G以上は1フレームあたりの行数ぶん落とす
  if(gravSpeed > 0){
    gravAccum += gravRowsPerFrame(gravSpeed);
    let moved = 0;
    while(gravAccum >= 1 && valid(cur,1,0,cur.state)){ cur.row++; gravAccum--; moved++; }
    if(moved > 0){ resetLock(); draw(); }
    if(!valid(cur,1,0,cur.state)){ gravAccum = 0; if(!isLocking) startLock(); }
  }
  rafId=requestAnimationFrame(loop);
}

// ===== DAS / ARR =====
const DAS=167, ARR=33;
let dasTimer=null, arrTimer=null, heldKey=null;
let softDropBtnTimer=null;

function startDAS(key){
  if(heldKey===key) return;
  stopDAS(); heldKey=key;
  dasTimer=setTimeout(()=>{
    if(heldKey!==key) return;
    arrTimer=setInterval(()=>{ if(heldKey===key){ if(key==='L') moveH(-1); else moveH(1); } }, ARR);
  }, DAS);
}
function stopDAS(){heldKey=null;if(dasTimer){clearTimeout(dasTimer);dasTimer=null;}if(arrTimer){clearInterval(arrTimer);arrTimer=null;}}

// 長押しで連続ソフトドロップ
function startSoftDropBtn(){
  softDrop();
  softDropBtnTimer=setInterval(()=>{ if(!gameOver) softDrop(); else stopSoftDropBtn(); }, 50);
}
function stopSoftDropBtn(){if(softDropBtnTimer){clearInterval(softDropBtnTimer);softDropBtnTimer=null;}}

// ===== キーボード（接続時） =====
document.addEventListener('keydown',e=>{
  if(e.code==='KeyN'){e.preventDefault();startGame();return;}
  if(gameOver) return;
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'){e.preventDefault();undo();return;}
  const c=e.code;
  if(c==='ArrowLeft'){e.preventDefault();moveH(-1);startDAS('L');}
  else if(c==='ArrowRight'){e.preventDefault();moveH(+1);startDAS('R');}
  else if(c==='ArrowDown'){e.preventDefault();if(!downHeld){downHeld=true;lastSoftDrop=0;softDrop();}}
  else if(c==='ArrowUp'||c==='KeyX'){e.preventDefault();if(!e.repeat)rotate(1);}
  else if(c==='KeyZ'){e.preventDefault();if(!e.repeat)rotate(-1);}
  else if(c==='Space'||c==='KeyC'){e.preventDefault();hardDrop();}
  else if(c==='ShiftLeft'||c==='ShiftRight'){e.preventDefault();doHold();}
  else if(c==='KeyU'){e.preventDefault();undo();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='ArrowRight') stopDAS();
  if(e.code==='ArrowDown') downHeld=false;
});

// ===== ゲームスタート =====
function startGame(){
  document.getElementById('overlay').style.display='none';
  cancelAnimationFrame(rafId);
  board=Array.from({length:TROW},()=>new Array(COLS).fill(null));
  bag=[];nextQ=[];holdType=null;canHold=true;autoGroup=[];
  score=0;level=1;lines=0;b2b=false;gameOver=false;
  dropInterval=1000;lastDrop=0;undoStack=[];lastGarbageCol=null;
  gravAccum=0; updateGravDisplay();   // 落下速度そのものは維持する
  downHeld=false;lastSoftDrop=0; stopDAS();
  digCount=0; updateDigCounter();
  ren=0; lastWasRotation=false; lastKickIndex=0;
  if(clearMsgTimer){clearTimeout(clearMsgTimer);clearMsgTimer=null;}
  const cm=document.getElementById('clearMsg'); if(cm) cm.style.opacity='0';
  if(renMode) setupRenTerrain();
  updUI(); fillQ(); spawn(); draw();
  rafId=requestAnimationFrame(loop);
}

document.getElementById('startBtn').addEventListener('click',startGame);

// ===== レイアウト初期化 =====
// パレットの高さは盤面の幅で段数が変わり、盤面の大きさはパレットの高さで変わる、
// という相互依存になっている。そこでマスの大きさを大きい方から順に試して、
// パレットまで含めて画面に収まる最大値を選ぶ。
// マスの大きさは盤面幅から決める。全色が横1段に並ぶ大きさにするので、
// パレットの高さは常に1段ぶんで済み、盤面をほとんど削らずに表示できる。
const PAL_GAP = 4, PAL_PAD = 5 * 2 + 2;   // CSSの gap / padding+border と合わせる
const PAL_MIN = 14, PAL_MAX = 26;         // マスの最小・最大
function paletteMetrics(boardW){
  const pw=document.getElementById('colorPaletteWrap');
  if(!pw || pw.style.display !== 'flex') return { h:0, sw:PAL_MAX };
  const n = document.querySelectorAll('.color-swatch').length || 9;
  const fit = Math.floor((boardW - PAL_PAD - PAL_GAP * (n - 1)) / n);
  const sw = Math.max(PAL_MIN, Math.min(PAL_MAX, fit));
  const perRow = Math.max(1, Math.floor((boardW - PAL_PAD + PAL_GAP) / (sw + PAL_GAP)));
  const rows = Math.ceil(n / perRow);
  return { h: rows * sw + (rows - 1) * PAL_GAP + PAL_PAD + 4, sw };   // +4 は中央カラムの gap
}

function initLayout(){
  const vw=window.innerWidth, vh=window.innerHeight;
  // サイドカラム幅: 画面幅の15%、最小44px、最大62px
  const sideW=Math.max(44,Math.min(62,Math.floor(vw*0.15)));
  // 利用可能ボード幅
  const availW=vw-sideW*2-5*2-8; // gaps + padding
  // 盤面以外の高さ（stats_bar + ctrl + opts + gaps）。実測値に合わせている
  const fixedH = 34 + 206 + 60 + 4*4 + 8;
  const maxBS = Math.min(Math.floor(availW/COLS), 28);
  const editing = document.getElementById('colorPaletteWrap').style.display === 'flex';
  const minBS = editing ? 10 : 16;
  BS = minBS;
  for(let b = maxBS; b >= minBS; b--){
    if(fixedH + ROWS*b + paletteMetrics(COLS*b).h <= vh){ BS = b; break; }
  }

  const bw=COLS*BS, bh=ROWS*BS;
  boardCanvas.width=bw; boardCanvas.height=bh;

  // サイドカラム幅を再計算してセット
  const actualSide=Math.floor((vw-bw-5*2-8)/2);
  document.getElementById('leftCol').style.width=actualSide+'px';
  document.getElementById('rightCol').style.width=actualSide+'px';

  const holdH=Math.floor(actualSide*0.85);
  holdCanvas.width=actualSide-6; holdCanvas.height=holdH;
  nextCanvas.width=actualSide-6; nextCanvas.height=holdH*NEXT_SHOW;

  // 中央要素の幅をボードに合わせる
  // （カラーパレットも入れないと、マスが横一列に伸びて画面外まではみ出す）
  document.getElementById('ctrlPad').style.width=bw+'px';
  document.getElementById('opts').style.width=bw+'px';
  document.getElementById('stats-bar').style.width=bw+'px';
  const palWrap=document.getElementById('colorPaletteWrap');
  palWrap.style.width=bw+'px';
  palWrap.style.setProperty('--swatch', paletteMetrics(bw).sw+'px');

  // 初期塗りつぶし
  boardCtx.fillStyle='#0d1117'; boardCtx.fillRect(0,0,bw,bh);
  holdCtx.fillStyle='#0d1117'; holdCtx.fillRect(0,0,holdCanvas.width,holdCanvas.height);
  nextCtx.fillStyle='#0d1117'; nextCtx.fillRect(0,0,nextCanvas.width,nextCanvas.height);
}

// ===== タッチイベント (passive:false で登録して長押しを確実に拾う) =====
function addTouchBtn(id, onStart, onEnd) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); onStart(); }, { passive: false });
  el.addEventListener('touchend',    e => { e.preventDefault(); onEnd();   }, { passive: false });
  el.addEventListener('touchcancel', e => { onEnd(); }, { passive: false });
}
addTouchBtn('btnLeft',
  () => { if(!gameOver){ moveH(-1); startDAS('L'); } },
  () => stopDAS()
);
addTouchBtn('btnRight',
  () => { if(!gameOver){ moveH(1);  startDAS('R'); } },
  () => stopDAS()
);
addTouchBtn('btnSoft',
  () => { if(!gameOver) startSoftDropBtn(); },
  () => stopSoftDropBtn()
);

// ===== バージョン =====
// 採番ルールと変更履歴は CHANGELOG.md を参照（PC版と同じ番号を使う）
const APP_VERSION = '1.2.0';
(function showVersion(){
  const el = document.getElementById('verLabel');
  if(!el) return;

// ===== カンペ画像（画面に重ねて表示する参考画像。何枚でも並べられる） =====
const SHOT_BAR_H = 24;
let shotSeq = 0;              // 新しいウィンドウを少しずつずらして出すためのカウンタ
let shotTarget = null;        // 画像を差し替える対象。null なら新規に1枚追加する

function shotWins(){ return [...document.querySelectorAll('.shot-win')]; }

// ダイアログを開く。win を渡すとその1枚を差し替え、省略すると新規追加になる
function openShot(win){
  shotTarget = win || null;
  document.getElementById('shotOverlay').classList.add('open');
  document.getElementById('shotFile').value = '';
  document.getElementById('shotCtrls').style.display = shotWins().length ? 'flex' : 'none';
}
function closeShot(){
  document.getElementById('shotOverlay').classList.remove('open');
  shotTarget = null;
}
function closeAllShots(){ shotWins().forEach(w => w.remove()); }
function pinAllShots(){ shotWins().forEach(w => setShotPin(w, true)); }

function setShotPin(win, on){
  win.classList.toggle('unpinned', !on);
  const btn = win.querySelector('[data-act="pin"]');
  btn.classList.toggle('on', on);
  btn.textContent = on ? '最前面 ON' : '最前面 OFF';
  btn.blur();
}

function createShotWindow(){
  const win = document.createElement('div');
  win.className = 'shot-win';
  win.innerHTML =
    '<div class="shot-bar">' +
      '<span class="sw-title">カンペ</span>' +
      '<button class="sw-btn on" data-act="pin">最前面 ON</button>' +
      '<button class="sw-btn" data-act="add">追加</button>' +
      '<button class="sw-btn" data-act="change">変更</button>' +
      '<button class="sw-btn" data-act="close">閉じる</button>' +
    '</div>' +
    '<div class="shot-body"><img alt=""></div>' +
    '<div class="sw-rs sw-rs-l"  data-dir="l"></div>' +
    '<div class="sw-rs sw-rs-r"  data-dir="r"></div>' +
    '<div class="sw-rs sw-rs-b"  data-dir="b"></div>' +
    '<div class="sw-rs sw-rs-bl" data-dir="bl"></div>' +
    '<div class="sw-rs sw-rs-br" data-dir="br"></div>';
  document.body.appendChild(win);
  return win;
}

function loadShotImage(src){
  const img = new Image();
  img.onload = () => {
    const replacing = shotTarget && document.body.contains(shotTarget);
    const win = replacing ? shotTarget : createShotWindow();
    win.querySelector('img').src = src;
    if(!replacing){
      const maxW = Math.min(280, window.innerWidth * 0.7);
      const maxH = window.innerHeight * 0.5 - SHOT_BAR_H;
      const sc = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
      const w = Math.max(120, Math.round(img.naturalWidth * sc));
      const h = Math.max(90, Math.round(img.naturalHeight * sc) + SHOT_BAR_H);
      const off = (shotSeq++ % 5) * 18;   // 2枚目以降は少しずつずらす
      win.style.width  = w + 'px';
      win.style.height = h + 'px';
      win.style.left = Math.max(4, Math.min(window.innerWidth - w - 4,
                        Math.round((window.innerWidth - w) / 2) + off)) + 'px';
      win.style.top  = Math.max(4, Math.min(window.innerHeight - 50, 60 + off)) + 'px';
    }
    closeShot();
  };
  img.onerror = () => alert('画像を読み込めませんでした。');
  img.src = src;
}
function loadShotFile(file){
  if(!file || !file.type.startsWith('image/')) return;
  const fr = new FileReader();
  fr.onload = e => loadShotImage(e.target.result);
  fr.readAsDataURL(file);
}

// バーで移動、辺と隅でサイズ変更（指でもマウスでも動くよう pointer events を使う）
function shotPointerDown(e, win, mode){
  if(e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  const r = win.getBoundingClientRect();
  const sx = e.clientX, sy = e.clientY;
  const l0 = r.left, t0 = r.top, w0 = r.width, h0 = r.height;
  const onMove = ev => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if(mode === 'move'){
      const l = Math.min(Math.max(l0 + dx, 24 - w0), window.innerWidth - 24);
      const t = Math.min(Math.max(t0 + dy, 0), window.innerHeight - 24);
      win.style.left = l + 'px'; win.style.top = t + 'px';
    } else {
      const MINW = 120, MINH = 90;
      if(mode.includes('r')) win.style.width = Math.max(MINW, w0 + dx) + 'px';
      if(mode.includes('l')){
        const w = Math.max(MINW, w0 - dx);
        win.style.width = w + 'px';
        win.style.left  = (l0 + w0 - w) + 'px';
      }
      if(mode.includes('b')) win.style.height = Math.max(MINH, h0 + dy) + 'px';
    }
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

(function initShotUI(){
  const drop = document.getElementById('shotDrop');
  const file = document.getElementById('shotFile');
  drop.addEventListener('click', () => file.click());
  file.addEventListener('change', e => loadShotFile(e.target.files[0]));
  ['dragenter','dragover'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', e => {
    const dt = e.dataTransfer;
    if(dt.files && dt.files[0]) loadShotFile(dt.files[0]);
  });
  window.addEventListener('paste', e => {
    if(!document.getElementById('shotOverlay').classList.contains('open')) return;
    for(const item of e.clipboardData.items){
      if(item.type.startsWith('image/')){ loadShotFile(item.getAsFile()); break; }
    }
  });
  document.getElementById('shotOverlay').addEventListener('pointerdown', e => {
    if(e.target.id === 'shotOverlay') closeShot();
  });
  // ウィンドウは動的に増えるのでイベントは document で受ける
  document.addEventListener('pointerdown', e => {
    const win = e.target.closest('.shot-win');
    if(!win) return;
    const rs = e.target.closest('.sw-rs');
    if(rs){ shotPointerDown(e, win, rs.dataset.dir); return; }
    if(e.target.closest('.sw-btn')) return;
    if(e.target.closest('.shot-bar')) shotPointerDown(e, win, 'move');
  });
  document.addEventListener('click', e => {
    const btn = e.target.closest('.shot-win .sw-btn');
    if(!btn) return;
    const win = btn.closest('.shot-win');
    const act = btn.dataset.act;
    if(act === 'pin')         setShotPin(win, win.classList.contains('unpinned'));
    else if(act === 'add')    openShot();
    else if(act === 'change') openShot(win);
    else if(act === 'close')  win.remove();
  });
})();

initPalette();
initLayout();
window.addEventListener('resize',()=>{initLayout();if(!gameOver&&board)draw();});

loadOptions();
loadGravSpeed();
loadDigSetting();

// 最初のスタート画面は出さず、読み込んだらそのまま始める
// （オーバーレイはゲームオーバー時の「もう一度」でだけ使う）
startGame();
